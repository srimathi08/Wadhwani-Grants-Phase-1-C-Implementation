<template>
    <!-- Brand toast banner (replaces native ShowToastEvent) -->
    <template if:true={bannerVisible}>
        <div class={bannerClass} role="alert" aria-live="assertive">
            <template if:true={isBannerError}>
                <svg class="error-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="12" y1="8" x2="12" y2="13"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </template>
            <template if:true={isBannerWarning}>
                <svg class="warning-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3 L22 20 L2 20 Z"></path>
                    <line x1="12" y1="9" x2="12" y2="14"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </template>
            <template if:true={isBannerSuccess}>
                <svg class="success-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <polyline points="8 12.5 11 15.5 16 9"></polyline>
                </svg>
            </template>
            <template if:true={isBannerInfo}>
                <svg class="info-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="12" y1="11" x2="12" y2="16"></line>
                    <line x1="12" y1="7.5" x2="12.01" y2="7.5"></line>
                </svg>
            </template>
            <div class="wg-toast-body">
                <span class="wg-toast-title">{bannerTitle}</span>
                <span>{bannerMessage}</span>
            </div>
            <button type="button" class="wg-toast-close" onclick={closeBanner} aria-label="Dismiss notification">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="6" y1="18" x2="18" y2="6"></line>
                </svg>
            </button>
        </div>
    </template>

    <div class="ps-root">

        <!-- Access notice — replaces the silent navigation that used to
             drop a validator into the reviewer queue -->
        <template if:true={accessNotice}>
            <div class="ps-notice" role="status">
                <lightning-icon
                    icon-name="utility:lock"
                    size="x-small"
                    class="ps-notice-icon">
                </lightning-icon>

                <div class="ps-notice-body">
                    <div class="ps-notice-title">{accessNotice.title}</div>
                    <div class="ps-notice-text">{accessNotice.body}</div>
                </div>

                <div class="ps-notice-actions">
                    <template if:true={accessNotice.canSwitch}>
                        <button type="button" class="ps-notice-btn" onclick={handleSwitchRole}>
                            {accessNotice.switchLabel}
                        </button>
                    </template>
                    <button
                        type="button"
                        class="ps-notice-dismiss"
                        onclick={dismissNotice}
                        aria-label="Dismiss">
                        &times;
                    </button>
                </div>
            </div>
        </template>

        <!-- Row 1: Intake -->
        <div class="ps-row-label">
            <span class="ps-row-text">Intake</span>
        </div>
        <div class="ps-grid">
            <template for:each={intakeTiles} for:item="tile">
                <div
                    key={tile.key}
                    class={tile.cardClass}
                    data-key={tile.key}
                    onclick={handleTileClick}>

                    <div class="ps-card-top">
                        <lightning-icon
                            icon-name={tile.icon}
                            size="x-small"
                            class={tile.iconClass}>
                        </lightning-icon>

                        <template if:true={tile.locked}>
                            <lightning-icon
                                icon-name="utility:lock"
                                size="xx-small"
                                class="ps-card-lock">
                            </lightning-icon>
                        </template>
                        <template if:false={tile.locked}>
                            <span class={tile.dotClass}></span>
                        </template>
                    </div>

                    <div class={tile.countClass}>{tile.count}</div>
                    <div class="ps-label">{tile.label}</div>

                    <template if:true={tile.locked}>
                        <div class="ps-sub ps-sub--locked">{tile.lockHint}</div>
                    </template>
                    <template if:false={tile.locked}>
                        <div class="ps-sub">{tile.sub}</div>
                    </template>

                </div>
            </template>
        </div>

        <!-- Divider -->
        <div class="ps-divider"></div>

        <!-- Row 2: Evaluation -->
        <div class="ps-row-label">
            <span class="ps-row-text">Evaluation</span>
        </div>
        <div class="ps-grid">
            <template for:each={evaluationTiles} for:item="tile">
                <div
                    key={tile.key}
                    class={tile.cardClass}
                    data-key={tile.key}
                    onclick={handleTileClick}>

                    <div class="ps-card-top">
                        <lightning-icon
                            icon-name={tile.icon}
                            size="x-small"
                            class={tile.iconClass}>
                        </lightning-icon>

                        <template if:true={tile.locked}>
                            <lightning-icon
                                icon-name="utility:lock"
                                size="xx-small"
                                class="ps-card-lock">
                            </lightning-icon>
                        </template>
                        <template if:false={tile.locked}>
                            <span class={tile.dotClass}></span>
                        </template>
                    </div>

                    <div class={tile.countClass}>{tile.count}</div>
                    <div class="ps-label">{tile.label}</div>

                    <template if:true={tile.locked}>
                        <div class="ps-sub ps-sub--locked">{tile.lockHint}</div>
                    </template>
                    <template if:false={tile.locked}>
                        <div class="ps-sub">{tile.sub}</div>
                    </template>

                </div>
            </template>
        </div>

        <!-- Loading spinner -->
        <template if:true={isLoading}>
            <div class="ps-loading">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

    </div>
</template>
