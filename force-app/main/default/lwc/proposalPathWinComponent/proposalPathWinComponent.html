<template>
   <lightning-card title="Proposal Status">
        <div class="path-container">
            <template for:each={computedPath} for:item="item">
                <div key={item.label} class={item.combinedClass}>
                    <template if:true={item.isCompleted}>
                        <span class="tick-icon">✔</span>
                    </template>
                    <span>{item.label}</span>

                    <template if:false={item.isLast}>
                        <div class={item.connectorClass}></div>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
