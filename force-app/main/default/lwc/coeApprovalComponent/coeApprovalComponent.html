<template>
    <lightning-card title="COE Admin Actions" class="slds-p-around_medium">

        <!-- ACTION BUTTONS -->
        <div class="action-bar">
            <button class="slds-button action-btn approve-btn"
                    data-action="Approve"
                    onclick={handleAction}
                    disabled={isButtonDisabled}>
                Approve
            </button>

            <button class="slds-button action-btn reject-btn"
                    data-action="Reject"
                    onclick={handleAction}
                    disabled={isButtonDisabled}>
                Reject
            </button>

            <button class="slds-button action-btn resubmit-btn"
                    data-action="Resubmit"
                    onclick={handleAction}
                    disabled={isButtonDisabled}>
                Resubmit
            </button>

            <!-- NEW: Escalate to PI — only shown once WIN Admin has made a Level 1 decision -->
            <template if:true={showEscalateButton}>
                <button class="slds-button action-btn escalate-btn"
                        data-action="Escalate"
                        onclick={handleAction}>
                    Escalate to PI
                </button>
            </template>
        </div>

        <!-- MODAL -->
        <template if:true={showModal}>
            <section class="slds-modal slds-fade-in-open slds-modal_large" role="dialog">
                <div class="slds-modal__container modal-container">

                    <!-- HEADER -->
                    <header class="slds-modal__header modal-header">
                        <h2 class="slds-text-heading_medium">
                            {modalTitle}
                        </h2>
                    </header>

                    <!-- BODY -->
                    <div class="slds-modal__content modal-body">

                        <!-- STEP 1 : COMMENTS (also used for Escalate) -->
                        <template if:true={isCommentsStep}>
                            <lightning-textarea
                                label={commentsLabel}
                                value={comments}
                                onchange={handleCommentsChange}
                                required>
                            </lightning-textarea>

                            <!-- RESUBMIT ONLY -->
                            <template if:true={isResubmit}>
                                <lightning-input
                                    class="slds-m-top_medium"
                                    type="date"
                                    label="Resubmission Due Date"
                                    value={dueDate}
                                    onchange={handleDueDateChange}
                                    required>
                                </lightning-input>
                            </template>
                        </template>

                        <!-- STEP 2 : COE REVIEW FORM -->
                        <template if:true={isFormStep}>
                            <c-level1-form
                                record-id={recordId}
                                onreviewcompleted={handleReviewCompleted}>
                            </c-level1-form>
                        </template>

                    </div>

                    <!-- FOOTER -->
                    <footer class="slds-modal__footer modal-footer">

                        <!-- COMMENTS FOOTER -->
                        <template if:true={isCommentsStep}>
                            <lightning-button
                                variant="neutral"
                                label="Cancel"
                                onclick={closeModal}>
                            </lightning-button>

                            <!-- NEW: Escalate footer -->
                            <template if:true={isEscalateAction}>
                                <lightning-button
                                    variant="destructive"
                                    label="Send Email to PI"
                                    icon-name="utility:send"
                                    icon-position="left"
                                    onclick={handleEscalateSubmit}>
                                </lightning-button>
                            </template>

                            <template if:false={isEscalateAction}>
                                <template if:false={isResubmit}>
                                    <lightning-button
                                        variant="brand"
                                        label="Next"
                                        onclick={goToFormStep}>
                                    </lightning-button>
                                </template>

                                <template if:true={isResubmit}>
                                    <lightning-button
                                        variant="brand"
                                        label="Submit"
                                        onclick={handleResubmit}>
                                    </lightning-button>
                                </template>
                            </template>
                        </template>

                        <!-- FORM FOOTER -->
                        <template if:true={isFormStep}>
                            <lightning-button
                                variant="neutral"
                                label="Back"
                                onclick={goBackToComments}>
                            </lightning-button>
                        </template>

                    </footer>

                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
