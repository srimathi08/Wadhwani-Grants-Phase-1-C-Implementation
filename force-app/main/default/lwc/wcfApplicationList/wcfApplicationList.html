<template>
    <div class="wcf-list-wrapper">

        <!-- ══ TOP BAR ══════════════════════════════════════════ -->
        <div class="wcf-top-bar">
            <div class="wcf-top-bar-left">
                <div class="wcf-brand-rule"></div>
                <div class="wcf-top-bar-titles">
                    <h1 class="wcf-top-title">Wadhwani Grants Validator Queue</h1>
                    <span class="wcf-top-sub">
                        <template if:true={applications}>
                          Total {applications.length} proposals.
                        </template>
                    </span>
                </div>
            </div>
            <div class="wcf-top-bar-right">
                <div class="wcf-search-wrap">
                    <lightning-icon icon-name="utility:search" size="x-small" class="wcf-search-icon"></lightning-icon>
                    <input
                        type="text"
                        placeholder="Search by ID, account, status…"
                        class="wcf-search-input"
                        value={searchTerm}
                        oninput={handleSearchInput}
                    />
                </div>
                <button class="wcf-icon-btn" onclick={handleRefresh} title="Refresh">
                    <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                </button>
            </div>
        </div>

        <!-- ══ SUMMARY ROW ══════════════════════════════════════ -->
        <template if:false={isLoading}>
            <div class="wcf-summary-row">
                <div class="wcf-summary-item" onclick={handleSummaryClick} data-filter="validated" title="Click to filter">
                    <span class="wcf-summary-num">{validatedCount}</span>
                    <span class="wcf-summary-lbl">Validated</span>
                </div>
                <div class="wcf-summary-div"></div>
                <div class="wcf-summary-item" onclick={handleSummaryClick} data-filter="validate" title="Click to filter">
                    <span class="wcf-summary-num">{validateCount}</span>
                    <span class="wcf-summary-lbl">To Validate</span>
                </div>
                <div class="wcf-summary-div"></div>
                <div class="wcf-summary-item" onclick={handleSummaryClick} data-filter="resume" title="Click to filter">
                    <span class="wcf-summary-num">{resumeCount}</span>
                    <span class="wcf-summary-lbl">In Progress</span>
                </div>
                <div class="wcf-summary-div"></div>
                <div class="wcf-summary-item" onclick={handleSummaryClick} data-filter="resubmit" title="Click to filter">
                    <span class="wcf-summary-num">{resubmitCount}</span>
                    <span class="wcf-summary-lbl">Revalidate</span>
                </div>

                <div class="wcf-summary-div"></div>
<div class="wcf-summary-item" onclick={handleSummaryClick} data-filter="returnedByReviewer" title="Click to filter">
    <span class="wcf-summary-num">{returnedByReviewerCount}</span>
    <span class="wcf-summary-lbl">Returned by Reviewer</span>
</div>

   <div class="wcf-summary-div"></div>
<div class="wcf-summary-item" onclick={handleSummaryClick} data-filter="awaiting" title="Click to filter">
    <span class="wcf-summary-num">{awaitingApplicantCount}</span>
    <span class="wcf-summary-lbl">Awaiting Application</span>
</div>
            </div>
        </template>

        <!-- Error state -->
        <template if:true={error}>
            <div class="wcf-error">
                <lightning-icon icon-name="utility:error" size="small" variant="error"></lightning-icon>
                <span>Could not load applications. {error}</span>
            </div>
        </template>

        <!-- Loading state -->
        <template if:true={isLoading}>
            <div class="wcf-loading">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                <p class="wcf-loading-text">Loading proposals…</p>
            </div>
        </template>

        <!-- Table -->
        <template if:false={isLoading}>
            <template if:true={hasRecords}>
                <div class="wcf-table-wrapper">
                    <table class="wcf-table">
                        <thead>
                            <tr>
                                <th class="wcf-th wcf-th-num">#</th>
                                <th class="wcf-th wcf-th-sortable" data-field="Application_ID__c" onclick={handleSort}>
                                    <div class="wcf-th-inner">
                                        Application ID
                                        <lightning-icon icon-name={sortIconId} size="xx-small" class="wcf-sort-icon"></lightning-icon>
                                    </div>
                                </th>
                                <th class="wcf-th wcf-th-sortable" data-field="Account.Name" onclick={handleSort}>
                                    <div class="wcf-th-inner">
                                        Account
                                        <lightning-icon icon-name={sortIconAccount} size="xx-small" class="wcf-sort-icon"></lightning-icon>
                                    </div>
                                </th>
                                <th class="wcf-th">Status</th>
                                <th class="wcf-th wcf-th-sortable" data-field="Due_Date__c" onclick={handleSort}>
    <div class="wcf-th-inner">
        Due Date
        <lightning-icon icon-name={sortIconDueDate} size="xx-small" class="wcf-sort-icon"></lightning-icon>
    </div>
</th>
                                <th class="wcf-th wcf-th-action">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredApplications} for:item="app" for:index="idx">
                                <tr key={app.Id} class={app.rowClass}>
                                    <td class="wcf-td wcf-td-num">{app.rowNum}</td>
                                    <td class="wcf-td wcf-td-id">
                                        <a href="#" data-id={app.Id} onclick={handleRecordClick} class="wcf-app-link">
                                            {app.Application_ID__c}
                                        </a>
                                        <div class="wcf-app-name">{app.Name}</div>
                                        <template if:true={app.hasTrackBadges}>
                                            <div class="wcf-track-badge-list">
                                                <template for:each={app.trackBadges} for:item="trk">
                                                    <span key={trk.label} class={trk.class}>{trk.label}</span>
                                                </template>
                                            </div>
                                        </template>
                                    </td>
                                    <td class="wcf-td">{app.acctName}</td>
                                    <td class="wcf-td">
                                        <span class={app.statusClass}>{app.Status}</span>
                                    </td>
                                    <td class="wcf-td wcf-td-date">{app.formattedDueDate}</td>
                                   <td class="wcf-td wcf-td-action">

    <!-- 0. Returned by Reviewer — takes priority over every other state -->
    <template if:true={app.isReturnedByReviewer}>
        <button
            class="wcf-action-btn wcf-btn-returned-reviewer"
            data-id={app.Id}
            data-name={app.Name}
            onclick={handleValidate}>
            <lightning-icon icon-name="utility:reply" size="xx-small" class="wcf-btn-icon"></lightning-icon>
            Returned by Reviewer
        </button>
    </template>

    <template if:false={app.isReturnedByReviewer}>

        <!-- 0b. Sealed via Return — waiting on the applicant, not actionable -->
        <template if:true={app.isAwaitingApplicant}>
            <span class="wcf-awaiting-badge">
                <lightning-icon icon-name="utility:clock" size="xx-small" class="wcf-awaiting-icon"></lightning-icon>
                Awaiting Applicant
            </span>
        </template>

        <template if:false={app.isAwaitingApplicant}>

            <!-- 1. Resubmission pending -->
            <template if:true={app.isResubmission}>
                <button
                    class="wcf-action-btn wcf-btn-revalidate"
                    data-id={app.Id}
                    data-name={app.Name}
                    onclick={handleValidate}>
                    <lightning-icon icon-name="utility:redo" size="xx-small" class="wcf-btn-icon"></lightning-icon>
                    Revalidate
                </button>
            </template>

            <!-- 2. Already validated -->
            <template if:false={app.isResubmission}>
                <template if:true={app.isValidated}>
                    <span class="wcf-validated-badge">
                        <lightning-icon icon-name="utility:check" size="xx-small" class="wcf-validated-icon"></lightning-icon>
                        Validated
                    </span>
                </template>

                <!-- 3. Not yet validated -->
                <template if:false={app.isValidated}>
                    <template if:true={app.hasDraft}>
                        <button
                            class="wcf-action-btn wcf-btn-resume"
                            data-id={app.Id}
                            data-name={app.Name}
                            onclick={handleValidate}>
                            <lightning-icon icon-name="utility:edit" size="xx-small" class="wcf-btn-icon"></lightning-icon>
                            Resume
                        </button>
                    </template>
                    <template if:false={app.hasDraft}>
                        <button
                            class="wcf-action-btn wcf-btn-validate"
                            data-id={app.Id}
                            data-name={app.Name}
                            onclick={handleValidate}>
                            <lightning-icon icon-name="utility:shield" size="xx-small" class="wcf-btn-icon"></lightning-icon>
                            Validate
                        </button>
                    </template>
                </template>
            </template>
        </template>
    </template>

</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="wcf-pagination">
                    <span class="wcf-page-info">
                        Showing {pageStart}–{pageEnd} of {allFiltered.length}
                    </span>
                    <div class="wcf-page-controls">
                        <button class="wcf-pg-btn" onclick={handlePrevPage} disabled={isPrevDisabled}>
                            <lightning-icon icon-name="utility:chevronleft" size="xx-small"></lightning-icon>
                        </button>
                        <span class="wcf-page-num">Page {currentPage} of {totalPages}</span>
                        <button class="wcf-pg-btn" onclick={handleNextPage} disabled={isNextDisabled}>
                            <lightning-icon icon-name="utility:chevronright" size="xx-small"></lightning-icon>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Empty state -->
            <template if:false={hasRecords}>
                <div class="wcf-empty">
                    <lightning-icon icon-name="utility:inbox" size="large" class="wcf-empty-icon"></lightning-icon>
                    <p class="wcf-empty-title">No proposals found</p>
                    <p class="wcf-empty-sub">Try adjusting your search or check back later.</p>
                </div>
            </template>
        </template>

    </div>
</template>
