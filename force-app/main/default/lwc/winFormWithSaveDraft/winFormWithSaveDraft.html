<template>   
    <template if:true={showForm}>
        
        <lightning-card>
         <!--  <div class="scrollable-content" onscroll={handleScroll}> --> 
    <div class="form-container">
        
        <div class="logo-container">
            <img src={winLogoUrl} alt="WIN Logo" class="win-logo" />
        <h1 class="form-title">PROJECT PROPOSAL FORM</h1>
    </div>

        
        <!--**************************************** GENERAL INFORMATION ******************************************  -->
       <!-- PAGE 1 -->
        <template if:true={isPage1}>
            <div class="form-page page1">
        <h2 class="section-headings">1. GENERAL DETAILS</h2>
        <lightning-layout multiple-rows>

            <lightning-layout-item size="12" class="slds-p-around_small">
                <lightning-input label="1.1. Project Title" name="Project_Title__c" value={applicationData.Project_Title__c}  variant="standard" onchange={handleInputChange} required></lightning-input>
            </lightning-layout-item>
            
            <lightning-layout-item size="12" class="slds-p-around_small">
                <lightning-combobox 
                    label="1.2. Primary Focus Area" 
                    options={primaryFocusAreaOptions} 
                    value={applicationData.Primary_Focus_Area__c}
                    onchange={handlePrimaryFocusChange}
                    required>
                </lightning-combobox>
            </lightning-layout-item>
            
            <template if:true={subFocusAreaOptions.length}>
                <lightning-layout-item size="12" class="slds-p-around_small">
                    <lightning-dual-listbox
                        label="1.2. Sub-Focus Area"
                        source-label="Available"
                        selected-label="Selected"
                        options={subFocusAreaOptions}
                        value={applicationData.Sub_Focus_Area__c}
                        onchange={handleSubFocusChange}
                        required>
                    </lightning-dual-listbox>
                </lightning-layout-item>
            </template>

            <lightning-layout-item size="12" class="slds-p-around_small">
                <lightning-input  label="1.3. Project Duration (In Months) (between 2 – 3 years)" name="Project_Duration__c" value={applicationData.Project_Duration__c} field-level-help="(In Months)" onchange={handleInputChange} required></lightning-input>
            </lightning-layout-item>

            <lightning-layout-item size="12" class="slds-p-around_small">
                <lightning-input type="url" label="1.4. Laboratory / Dept / Organization Website" field-level-help="Provide a link (if applicable)" name="Project_Website_if_any__c" value={applicationData.Project_Website_if_any__c} onchange={handleInputChange}></lightning-input>
            </lightning-layout-item>

            <lightning-layout-item size="12" class="slds-p-around_small">
                <lightning-textarea label="1.5. Keywords that describe your Project (6 keywords separated by comma which best describe your project) (word limit: 25)" name="Keywords__c" value={applicationData.Keywords__c} field-level-help="Six key words separated by comma which best describe your project may be provided" onchange={handleInputChange} required></lightning-textarea>
            </lightning-layout-item>

        </lightning-layout>

        <!-- PREVIOUS and NEXT Button -->

        <div class="button-container slds-text-align_right">
            <lightning-button label="Previous" variant="destructive-text" onclick={handlePrevious}></lightning-button>
            <lightning-button label="Next" variant="destructive-text" onclick={handleNext} class="slds-m-left_small"></lightning-button>
          <lightning-button label="Save Draft" 
                variant="neutral"
                onclick={handleSaveDraft} 
                class="slds-m-left_small">
            </lightning-button>
            </div>
        </div> <!-- button-container -->
         
        <div class="slds-m-top_medium">
            <div class="slds-grid slds-grid_align-spread slds-p-bottom_x-small">
              <span>{currentPage} of {totalPages}</span>
            </div>
        
            <div class="slds-progress-bar" role="progressbar"
                 aria-valuemin="0" aria-valuemax="8" aria-valuenow={currentPage}>
              <span class={progressClass}>
                <span class="slds-assistive-text">Progress: {currentPage} of {totalPages}</span>
              </span>
            </div>
            </div>
            </template>

        <!--**************************************** Applicant Details  ******************************************  -->
        <!-- PAGE 2 -->
        <template if:true={isPage2}>
            <div class="form-page page2">
        <h2 class="section-headings">2. APPLICANT DETAILS</h2>
        <lightning-layout multiple-rows>

        <!-- PI Contact Name as Text -->
            <lightning-layout-item size="12" class="slds-p-around_small">
                <div class="form-subsection-heading">2.1. Details of Principal Investigator</div>
                <lightning-layout>
                    <lightning-layout-item size="6" class="slds-p-right_small">             
                      <lightning-input label="Principal Investigator (PI)" name="PI_Name__c" value={applicationData.PI_Name__c} variant="standard" onchange={handleInputChange} required></lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item size="6">
                        <lightning-input label="Designation" name="PI_Designation__c" value={applicationData.PI_Designation__c} variant="standard" onchange={handleInputChange} required></lightning-input> 
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>

             <!-- Display the Account Name -->
          <lightning-layout-item size="12" class="slds-p-around_small">
            <lightning-input label="Institution Name" value={applicationData.Institution_Name__c} disabled></lightning-input>
        </lightning-layout-item>

            <!-- PI DETAILS -->
           <lightning-layout-item size="12" class="slds-p-around_small">
                <div class="slds-text-title_bold slds-m-bottom_x-small"></div>
                <lightning-layout>
                    <lightning-layout-item size="6" class="slds-p-right_small">
                        <lightning-input  type="Text" name="PI_Phone__c" label="Principal Investigator Phone" value={applicationData.PI_Phone__c} onchange={handleInputChange} required></lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item size="6">
                        <lightning-input  type="Email" name="PI_Email__c" label="Principal Investigator Email" value={applicationData.PI_Email__c} onchange={handleInputChange} required></lightning-input> 
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item> 


            <!-- CO-PI Contact Name as Text -->
            <lightning-layout-item size="12" class="slds-p-around_small">
                <div class="form-subsection-heading">2.2. Details of Co-Principal Investigator</div>
                <lightning-layout>
                    <lightning-layout-item size="6" class="slds-p-right_small">             
                        <lightning-input label="Co-Principal Investigator (Co-PI)" name="Co_Principal_Investigator_Co_PI__c" value={applicationData.Co_Principal_Investigator_Co_PI__c} variant="standard" onchange={handleInputChange}></lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item size="6">
                        <lightning-input label="Designation" name="CO_PI_Designation__c" value={applicationData.CO_PI_Designation__c} variant="standard" onchange={handleInputChange}></lightning-input> 
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
           
            <!--CO-PI Institution-->
            <lightning-layout-item size="12" class="slds-p-around_small">
                <lightning-input label="Institution" name="CO_PI_Institution__c" value={applicationData.CO_PI_Institution__c}  variant="standard" onchange={handleInputChange}></lightning-input>
            </lightning-layout-item>

              <!-- CO-PI DETAILS -->
          <lightning-layout-item size="12" class="slds-p-around_small">
            <div class="slds-text-title_bold slds-m-bottom_x-small"></div>
            <lightning-layout>
                <lightning-layout-item size="6" class="slds-p-right_small">
                    <lightning-input  type="Text" name="CO_PI_Phone__c" label="Co-Principal Investigator Phone" value={applicationData.CO_PI_Phone__c} onchange={handleInputChange}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6">
                    <lightning-input  type="Email" name="CO_PI_Email__c" label="Co-Principal Investigator Email" value={applicationData.CO_PI_Email__c} onchange={handleInputChange}></lightning-input> 
                </lightning-layout-item>
            </lightning-layout>
        </lightning-layout-item> 

       <!-- <lightning-layout-item size="12" class="slds-p-around_small">
            <lightning-textarea label="Details of Team Members / Mentors / Advisers involved in the Project" name="Project_Team_Members__c" value={applicationData.Project_Team_Members__c} field-level-help="" onchange={handleInputChange} ></lightning-textarea>
        </lightning-layout-item> -->

        <lightning-layout-item size="12" class="slds-p-around_small">
            <!-- Label with Help Text -->
            <div class="label-container">
                <label class="slds-form-element__label" for="teamMembers">
                    <abbr class="slds-required" title="required">*</abbr>
                    2.3. Details of Team Members / Mentors / Advisers involved in the Project (Word Limit: 50)</label>
                <lightning-helptext content="Name, Affiliation and Expertise"></lightning-helptext>
            </div>

            <div class="editor-container">
                <!-- Toolbar -->
                <div class="toolbar slds-grid slds-wrap slds-gutters_xx-small slds-align_absolute-center">
                    <!-- Font selection -->
                    <div class="slds-col">
                        <select class="slds-select" onchange={changeFont}>
                            <option value="">Font</option>
                            <option value="Arial">Arial</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                        </select>
                    </div>
                
                    <!-- Font Size selection -->
                    <div class="slds-col">
                        <select class="slds-select" onchange={changeFontSize}>
                            <option value="">Size</option>
                            <option value="1">Small</option>
                            <option value="3">Normal</option>
                            <option value="5">Large</option>
                            <option value="7">Extra Large</option>
                        </select>
                    </div>
                
                    <!-- Bold -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={boldText} title="Bold">
                            <lightning-icon icon-name="utility:bold" size="x-small"></lightning-icon>
                        </button>
                    </div>
                
                    <!-- Italic -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={italicText} title="Italic">
                            <lightning-icon icon-name="utility:italic" size="x-small"></lightning-icon>
                        </button>
                    </div>
                
                    <!-- Underline -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={underlineText} title="Underline">
                            <lightning-icon icon-name="utility:underline" size="x-small"></lightning-icon>
                        </button>
                    </div>

  
                      <!-- Number List -->
                           <div class="slds-col">
                             <button class="toolbar-button slds-button slds-button_icon" onclick={insertNumberList} title="Numbered List">
                               <lightning-icon icon-name="utility:number_input" size="x-small"></lightning-icon>
                             </button>
                           </div>

                                          
                    <!-- Align Left -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={alignLeft} title="Align Left">
                            <lightning-icon icon-name="utility:left_align_text" size="x-small"></lightning-icon>
                        </button>
                    </div>
                
                    <!-- Align Center -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={alignCenter} title="Align Center">
                            <lightning-icon icon-name="utility:center_align_text" size="x-small"></lightning-icon>
                        </button>
                    </div>
                
                    <!-- Align Right -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={alignRight} title="Align Right">
                            <lightning-icon icon-name="utility:right_align_text" size="x-small"></lightning-icon>
                        </button>
                    </div>
                </div>
                

                <!-- Editable Text Area -->
                <div class="text-area" contenteditable="true" data-field="Project_Team_Members__c"
                onclick={setActiveField} oninput={handleInput} onpaste={handlePaste} onkeydown={handleKeyDown}>
           </div>
           <!-- Error message container -->
           <p class="error-msg" data-error="Project_Team_Members__c"></p>
            </div>
        </lightning-layout-item>

        </lightning-layout-item> -->

        <lightning-layout-item size="12" class="slds-p-around_small">
            <!-- Label with Help Text -->
            <div class="label-container">
                <label class="slds-form-element__label" for="expertiseTeam">
                    <abbr class="slds-required" title="required">*</abbr>
                    2.4. Expertise and Experience of Team in Specific Focus Area of Project (Word Limit: 25)</label>
             <!-- <lightning-helptext content="Define clear and measurable objectives with definite deliverables"></lightning-helptext> -->  
            </div>

            <div class="editor-container">
                <!-- Toolbar -->
                <div class="toolbar slds-grid slds-wrap slds-gutters_xx-small slds-align_absolute-center">
                    <!-- Font selection -->
                    <div class="slds-col">
                        <select class="slds-select" onchange={changeFont}>
                            <option value="">Font</option>
                            <option value="Arial">Arial</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                        </select>
                    </div>
                
                    <!-- Font Size selection -->
                    <div class="slds-col">
                        <select class="slds-select" onchange={changeFontSize}>
                            <option value="">Size</option>
                            <option value="1">Small</option>
                            <option value="3">Normal</option>
                            <option value="5">Large</option>
                            <option value="7">Extra Large</option>
                        </select>
                    </div>
                
                    <!-- Bold -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={boldText} title="Bold">
                            <lightning-icon icon-name="utility:bold" size="x-small"></lightning-icon>
                        </button>
                    </div>
                
                    <!-- Italic -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={italicText} title="Italic">
                            <lightning-icon icon-name="utility:italic" size="x-small"></lightning-icon>
                        </button>
                    </div>
                
                    <!-- Underline -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={underlineText} title="Underline">
                            <lightning-icon icon-name="utility:underline" size="x-small"></lightning-icon>
                        </button>
                    </div>

                      <!-- Number List -->
                           <div class="slds-col">
                             <button class="toolbar-button slds-button slds-button_icon" onclick={insertNumberList} title="Numbered List">
                               <lightning-icon icon-name="utility:number_input" size="x-small"></lightning-icon>
                             </button>
                           </div>

                    
                     <!-- Bullet List -->
                      <div class="slds-col">
                       <button class="toolbar-button slds-button slds-button_icon" onclick={insertBulletPoints} title="Bullet List">
                          <lightning-icon icon-name="utility:list" size="x-small"></lightning-icon>
                        </button>
                        </div>     

                    <!-- Align Left -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={alignLeft} title="Align Left">
                            <lightning-icon icon-name="utility:left_align_text" size="x-small"></lightning-icon>
                        </button>
                    </div>
                
                    <!-- Align Center -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={alignCenter} title="Align Center">
                            <lightning-icon icon-name="utility:center_align_text" size="x-small"></lightning-icon>
                        </button>
                    </div>
                
                    <!-- Align Right -->
                    <div class="slds-col">
                        <button class="toolbar-button slds-button slds-button_icon" onclick={alignRight} title="Align Right">
                            <lightning-icon icon-name="utility:right_align_text" size="x-small"></lightning-icon>
                        </button>
                    </div>
                </div>
                

                <!-- Editable Text Area -->
                <div class="text-area" contenteditable="true" data-field="Expertise_and_Experience_of_Team_in_Spec__c"
                onclick={setActiveField} oninput={handleInput} onpaste={handlePaste} onkeydown={handleKeyDown}> 
           </div>
           <!-- Error message container -->
           <p class="error-msg" data-error="Expertise_and_Experience_of_Team_in_Spec__c"></p>
            </div>
        </lightning-layout-item>
        <!-- 2.5 Start-up Details -->
        <lightning-layout-item size="12" class="slds-p-around_small">
            <div class="form-subsection-heading">
                2.5. Start-up Details
            </div>
            <p class="note-text">
                (applicable if the applicant is a Start-up, not an academic/faculty team;
                PI and one of the founders shall be same)
            </p>
        </lightning-layout-item>

        <lightning-layout-item size="12" class="slds-p-around_small">
            <lightning-input label="2.5.1. Name of Start-up" name="Startup_Name__c"
                value={applicationData.Startup_Name__c} onchange={handleInputChange}>
            </lightning-input>
        </lightning-layout-item>

        <!-- 2.6 Founder -->
        <lightning-layout-item size="12" class="slds-p-around_small">
            <div class="form-subsection-heading">2.5.2. Details of Founder/Co-Founder</div>
            <lightning-layout>
                <lightning-layout-item size="6" class="slds-p-right_small">
                    <lightning-input label="Name" name="Founder_Name__c"
                        value={applicationData.Founder_Name__c} onchange={handleInputChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6">
                    <lightning-input label="Designation" name="Founder_Designation__c"
                        value={applicationData.Founder_Designation__c} onchange={handleInputChange}>
                    </lightning-input>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-layout-item>
        <lightning-layout-item size="12" class="slds-p-around_small">
            <lightning-input label="Institution / Organization" name="Founder_Institution__c"
                value={applicationData.Founder_Institution__c} onchange={handleInputChange}>
            </lightning-input>
        </lightning-layout-item>
        <lightning-layout-item size="12" class="slds-p-around_small">
            <lightning-layout>
                <lightning-layout-item size="6" class="slds-p-right_small">
                    <lightning-input type="text" label="Mobile Number" name="Founder_Mobile__c"
                        value={applicationData.Founder_Mobile__c} onchange={handleInputChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6">
                    <lightning-input type="Email" label="Email ID" name="Founder_Email__c"
                        value={applicationData.Founder_Email__c} onchange={handleInputChange}>
                    </lightning-input>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-layout-item>

        <!-- 2.7 Co-Founder -->
       <!-- 2.7 Co-Founder(s) — repeatable -->
<lightning-layout-item size="12" class="slds-p-around_small">
    <div class="form-subsection-heading">2.5.3. Details of Co-Founder(s)</div>

    <template for:each={coFounders} for:item="cofounder">
        <div key={cofounder.uniqueId} class="slds-box slds-m-bottom_small">
            <lightning-layout>
                <lightning-layout-item size="6" class="slds-p-right_small">
                    <lightning-input label="Name" data-id={cofounder.uniqueId} data-field="Name"
                        value={cofounder.Name} onchange={handleCoFounderChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6">
                    <lightning-input label="Designation" data-id={cofounder.uniqueId} data-field="Designation__c"
                        value={cofounder.Designation__c} onchange={handleCoFounderChange}>
                    </lightning-input>
                </lightning-layout-item>
            </lightning-layout>
            <lightning-input label="Institution / Organization" data-id={cofounder.uniqueId} data-field="Institution__c"
                value={cofounder.Institution__c} onchange={handleCoFounderChange}>
            </lightning-input>
            <lightning-layout>
                <lightning-layout-item size="6" class="slds-p-right_small">
                    <lightning-input type="text" label="Mobile Number" data-id={cofounder.uniqueId} data-field="Mobile__c"
                        value={cofounder.Mobile__c} onchange={handleCoFounderChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6">
                    <lightning-input type="Email" label="Email ID" data-id={cofounder.uniqueId} data-field="Email__c"
                        value={cofounder.Email__c} onchange={handleCoFounderChange}>
                    </lightning-input>
                </lightning-layout-item>
            </lightning-layout>
            <div class="slds-text-align_right">
                <lightning-button-icon icon-name="utility:delete" alternative-text="Delete Co-Founder"
                    title="Remove" variant="bare" data-id={cofounder.uniqueId} onclick={deleteCoFounderRow}>
                </lightning-button-icon>
            </div>
        </div>
    </template>

    <lightning-button label="+ Add Co-Founder" variant="destructive-text" onclick={addCoFounder}></lightning-button>
</lightning-layout-item>

        <!-- 2.8 Registration status -->
        <lightning-layout-item size="12" class="slds-p-around_small">
            <lightning-combobox label="2.5.4. Is the start-up registered?"
                name="Is_Startup_Registered__c"
                value={applicationData.Is_Startup_Registered__c}
                options={yesNoOptions}
                onchange={handleInputChange}>
            </lightning-combobox>
        </lightning-layout-item>
        <template if:true={showStartupRegDetails}>
            <lightning-layout-item size="12" class="slds-p-around_small">
                <lightning-layout>
                    <lightning-layout-item size="6" class="slds-p-right_small">
                        <lightning-input type="date" label="Date of Incorporation"
                            name="Startup_Registration_Date__c"
                            value={applicationData.Startup_Registration_Date__c}
                            onchange={handleInputChange}>
                        </lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item size="6">
                        <lightning-input label="Registration No. / CIN"
                            name="Startup_Registration_No__c"
                            value={applicationData.Startup_Registration_No__c}
                            onchange={handleInputChange}>
                        </lightning-input>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
        </template>

        <lightning-layout-item size="12" class="slds-p-around_small">
            <lightning-combobox label="2.5.5. Is the start-up DPIIT registered?"
                name="Is_Startup_DPIIT_Registered__c"
                value={applicationData.Is_Startup_DPIIT_Registered__c}
                options={yesNoOptions}
                onchange={handleInputChange}>
            </lightning-combobox>
        </lightning-layout-item>
        <template if:true={showDpiitRegDetails}>
            <lightning-layout-item size="12" class="slds-p-around_small">
                <lightning-input label="DPIIT Registration No."
                    name="DPIIT_Registration_No__c"
                    value={applicationData.DPIIT_Registration_No__c}
                    onchange={handleInputChange}>
                </lightning-input>
            </lightning-layout-item>
        </template>
          
            </lightning-layout>

            <!-- NEXT and PREVIOUS BUTTON -->

            <div class="button-container slds-text-align_right">
                <lightning-button label="Previous" variant="destructive-text" onclick={handlePrevious}></lightning-button>         
                <lightning-button label="Next" variant="destructive-text" onclick={handleNext} class="slds-m-left_small"></lightning-button>    
             <lightning-button label="Save Draft" 
                variant="neutral"
                onclick={handleSaveDraft} 
                class="slds-m-left_small">
            </lightning-button>
            </div>

            <div class="slds-m-top_medium">
                <div class="slds-grid slds-grid_align-spread slds-p-bottom_x-small">
                  <span>{currentPage} of {totalPages}</span>
                </div>
            
                <div class="slds-progress-bar" role="progressbar"
                     aria-valuemin="0" aria-valuemax="8" aria-valuenow={currentPage}>
                  <span class={progressClass}>
                    <span class="slds-assistive-text">Progress: {currentPage} of {totalPages}</span>
