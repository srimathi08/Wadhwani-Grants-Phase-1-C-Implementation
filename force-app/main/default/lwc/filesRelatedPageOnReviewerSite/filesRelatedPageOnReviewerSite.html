<template>
    <template if:true={files}>
        <div class="slds-box slds-theme_default slds-p-around_medium">
            <h2 class="slds-text-heading_small slds-m-bottom_medium">Files</h2>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">
                            <div class="slds-truncate" title="File Name">File Name</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={files} for:item="file">
                        <tr key={file.id}>
                            <td>
                                <a href={file.url} target="_blank" class="slds-text-link">
                                    {file.title}
                                </a>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>

    <template if:true={error}>
        <p class="slds-text-color_error slds-p-around_medium">Error: {error.message}</p>
    </template>
</template>
