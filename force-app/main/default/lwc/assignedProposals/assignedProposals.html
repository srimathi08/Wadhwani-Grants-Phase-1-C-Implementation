<template>
    <div class="custom-table-card">

        <!-- HEADER -->
        <div class="table-header">
            <h2>Assigned Applications</h2>
        </div>

        <!-- LOADING -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium">
            </lightning-spinner>
        </template>

        <!-- ERROR -->
        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_medium">
                {errorMessage}
            </div>
        </template>

        <!-- TABLE -->
        <template if:true={hasData}>
            <div class="table-container">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>COE Name</th>
                            <th>Application Name</th>
                            <th>Project Title</th>
                            <th>Primary Focus Area</th>
                            <th>Reviewer Action</th>
                            <th>Do you wish to review this application?</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template for:each={applications} for:item="app">
                            <tr key={app.applicationId}>

                                <!-- COE -->
                                <td>{app.coeName}</td>

                                <!-- APPLICATION NAME -->
                                <td>
                                    <a href={app.recordUrl} class="link-red">
                                        {app.applicationName}
                                    </a>
                                </td>

                                <!-- PROJECT TITLE -->
                                <td>{app.projectTitle}</td>

                                <!-- PRIMARY FOCUS -->
                                <td>{app.primaryFocusArea}</td>

                                <!-- REVIEWER ACTION -->
                                <td>
                                    <span class={app.reviewerActionClass}>
                                        {app.reviewerAction}
                                    </span>
                                </td>

                                <!-- ACTION BUTTONS -->
                                <td>
                                    <div class="action-cell">
                                        <lightning-button
                                            label="Accept"
                                            variant="brand"
                                            size="small"
                                            data-id={app.applicationId}
                                            onclick={handleAccept}
                                            disabled={app.isActionDisabled}>
                                        </lightning-button>

                                        <lightning-button
                                            label="Reject"
                                            variant="destructive"
                                            size="small"
                                            data-id={app.applicationId}
                                            onclick={handleReject}
                                            disabled={app.isActionDisabled}>
                                        </lightning-button>
                                    </div>
                                </td>

                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- EMPTY STATE -->
        <template if:false={hasData}>
            <div class="slds-text-align_center slds-p-around_medium">
                No assigned applications found.
            </div>
        </template>

    </div>

    <!-- =========================
         REJECT MODAL
    ========================== -->
    <template if:true={isRejectModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <!-- MODAL HEADER -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        Reject Proposal
                    </h2>
                </header>

                <!-- MODAL BODY -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        label="Rejection Comment"
                        value={rejectComment}
                        onchange={handleCommentChange}
                        required>
                    </lightning-textarea>
                </div>

                <!-- MODAL FOOTER -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeRejectModal}>
                    </lightning-button>

                    <lightning-button
                        label="Reject"
                        variant="destructive"
                        class="slds-m-left_small"
                        onclick={confirmReject}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <!-- BACKDROP -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
