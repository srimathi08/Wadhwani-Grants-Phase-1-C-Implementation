<template>
<div class="dashboard">

    <!-- HEADER -->
    <div class="header">
        <h1>Funded Project Status</h1>
        <p>Overview of funded projects, budget distribution and key metrics</p>
    </div>

    <!-- KPI -->
    <div class="kpi-row">
        <div class="kpi-card primary">
            <div class="icon">📊</div>
            <div>
                <span>Total Projects Funded</span>
                <h2>{totalProjectsFunded}</h2>
            </div>
        </div>
        <div class="kpi-card gradient">
            <div class="icon">💰</div>
            <div>
                <span>Total Budget (USD)</span>
                <h2>$ {totalReceived}</h2>
            </div>
        </div>
        <div class="kpi-card">
            <div class="icon">📦</div>
            <div>
                <span>Grant Money Available</span>
                <h2>$ {grantAvailable}</h2>
            </div>
        </div>
    </div>

    <!-- MAIN GRID -->
    <div class="grid">

        <!-- LEFT PANEL -->
        <div class="panel">
            <h3>Budget Split (Project / Operational Grants)</h3>
            <div class="mini-grid">
                <div class="mini-card">
                    <span>Project Grant (Budget)</span>
                    <h3>$ {projectGrantReceived}</h3>
                </div>
                <div class="mini-card">
                    <span>Operational Grant (Budget)</span>
                    <h3>$ {operationalGrantReceived}</h3>
                </div>
                <div class="mini-card success">
                    <span>Funds Disbursed</span>
                    <h3>$ {disbursed}</h3>
                </div>
                <div class="mini-card info">
                    <span>Total Balance</span>
                    <h3>$ {available}</h3>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="panel">
            <h3>Metrics (Avg TRL, Expected TRL, Duration)</h3>

            <div class="metric-card clickable" onclick={openTRLModal}>
                <div class="metric-header">
                    <span>Average TRL <span class="click-hint">↗ View Details</span></span>
                    <strong>{avgTRLFormatted} / {expectedTRLFormatted}</strong>
                </div>
                <div class="progress">
                    <div class="progress-fill" style={avgTRLStyle}></div>
                </div>
            </div>

            <div class="metric-card clickable" onclick={openTRLModal}>
                <div class="metric-header">
                    <span>Expected TRL <span class="click-hint">↗ View Details</span></span>
                    <strong>{expectedTRLFormatted} / 9</strong>
                </div>
                <div class="progress purple">
                    <div class="progress-fill" style={expectedTRLStyle}></div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span>Duration</span>
                    <strong>{duration} months</strong>
                </div>
            </div>
        </div>

    </div>

    <!-- CTA -->
    <button class="cta" onclick={navigateToFund}>
        Manage Fund Distribution →
    </button>

    <!-- ============ TRL MODAL ============ -->
    <template if:true={isTRLModalOpen}>
        <div class="modal-backdrop" onclick={closeTRLModal}></div>

        <div class="trl-modal">

            <div class="trl-modal-header">
                <h2>TRL Breakdown by Project</h2>
                <button class="close-btn" onclick={closeTRLModal}>✕</button>
            </div>

            <div class="trl-modal-body">

                <!-- FUNDING CYCLE PILLS -->
                <div class="cycle-filter-bar">
                    <span class="cycle-label">Funding Cycle</span>
                    <div class="cycle-pills">
                        <template for:each={fundingYears} for:item="yr">
                            <button
                                key={yr.value}
                                class={yr.btnClass}
                                data-year={yr.value}
                                onclick={handleCycleFilter}>
                                {yr.label}
                            </button>
                        </template>
                    </div>
                </div>

                <!-- DATE RANGE FILTER -->
                <div class="date-range-bar">
                    <span class="cycle-label">Date Range</span>
                    <div class="date-range-inputs">

                        <div class="date-input-group">
                            <label>From</label>
                            <lightning-input
                                type="date"
                                name="fromDate"
                                value={fromDate}
                                onchange={handleFromDateChange}
                                variant="label-hidden">
                            </lightning-input>
                        </div>

                        <span class="date-range-sep">→</span>

                        <div class="date-input-group">
                            <label>To</label>
                            <lightning-input
                                type="date"
                                name="toDate"
                                value={toDate}
                                onchange={handleToDateChange}
                                variant="label-hidden">
                            </lightning-input>
                        </div>

                        <template if:true={hasDateRange}>
                            <button class="clear-date-btn" onclick={handleClearDates}>
                                ✕ Clear Dates
                            </button>
                        </template>

                    </div>
                </div>

                <!-- FILTER RESULT COUNT -->
                <div class="filter-count">
                    Showing <strong>{filteredCount}</strong> of <strong>{totalCount}</strong> projects
                    <template if:true={isFiltered}>
                        &nbsp;·&nbsp;
                        <template if:true={hasDateRange}>
                            <template if:true={fromDate}>
                                From <strong>{fromDate}</strong>&nbsp;
                            </template>
                            <template if:true={toDate}>
                                To <strong>{toDate}</strong>
                            </template>
                        </template>
                        <template if:false={hasDateRange}>
                            Cycle <strong>{selectedCycle}</strong>
                        </template>
                    </template>
                </div>

                <!-- TRL LEGEND -->
                <div class="trl-legend">
                    <div class="legend-row">
                        <span class="legend-dot base"></span>
                        <span>Base TRL</span>
                        <span class="legend-dot current"></span>
                        <span>Current TRL</span>
                        <span class="legend-dot expected"></span>
                        <span>Expected TRL</span>
                    </div>
                </div>

                <!-- PER PROJECT ROWS -->
                <template if:true={isTRLLoaded}>

                    <template if:true={hasFilteredProjects}>
                        <template for:each={filteredTRLProjects} for:item="p">
                            <div key={p.proposalId} class="trl-project-row">

                                <div class="trl-project-name">
                                    <div class="proj-name-row">
                                        <p class="proj-name">{p.name}</p>
                                        <template if:true={p.fundingYear}>
                                            <span class="cycle-badge">{p.fundingYear}</span>
                                        </template>

                                    </div>
                                    <template if:true={p.projectTitle}>
                                        <p class="proj-title">{p.projectTitle}</p>
                                    </template>
                                </div>

                                <!-- TRL SCALE -->
                                <div class="trl-scale-wrapper">
                                    <template for:each={p.steps} for:item="s">
                                        <div key={s.n} class={s.colClass}>
                                            <span class="trl-step-number">{s.n}</span>
                                            <div class={s.stepClass}></div>
                                        </div>
                                    </template>
                                </div>

                                <!-- NUMBERS -->
                                <div class="trl-numbers">
                                    <span class="base-trl">Base: <strong>{p.baseTRL}</strong></span>
                                    <span class="current-trl">Current: <strong>{p.currentTRL}</strong></span>
                                    <span class="expected-trl">Expected: <strong>{p.expectedTRL}</strong></span>
                                </div>

                                <!-- WORK DONE -->
                                <template if:true={p.workDone}>
                                    <div class="work-done">
                                        <p class="work-label">Work Supporting Current TRL:</p>
                                        <lightning-formatted-rich-text
                                            value={p.workDone}>
                                        </lightning-formatted-rich-text>
                                    </div>
                                </template>

                            </div>
                        </template>
                    </template>

                    <!-- NO RESULTS STATE -->
                    <template if:false={hasFilteredProjects}>
                        <div class="no-results">
                            <p>No projects found for the selected filter criteria.</p>
                            <button class="filter-reset-btn" onclick={resetAllFilters}>
                                Show All
                            </button>
                        </div>
                    </template>

                </template>

                <template if:false={isTRLLoaded}>
                    <div class="trl-loading">
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </div>
                </template>

            </div>
        </div>
    </template>

</div>
</template>
