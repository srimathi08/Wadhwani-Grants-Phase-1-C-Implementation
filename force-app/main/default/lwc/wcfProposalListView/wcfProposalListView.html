<template>
    <div class="wg-page wcf-rq">

        <!-- ══ PAGE HEADER ══════════════════════════════════════ -->
        <div class="wg-page-header">
            <div class="wg-page-heading">
                <p class="wg-page-eyebrow">Reviewer portal</p>
                <h1 class="wg-page-title">Wadhwani Grants Review Proposals</h1>
                <p class="wg-page-subtitle">{subtitle}</p>
            </div>
            <div class="wg-page-actions">
                <div class="wg-search">
                    <lightning-icon icon-name="utility:search" size="x-small" alternative-text=""></lightning-icon>
                    <input
                        type="text"
                        placeholder="Search by ID, organization, submitter…"
                        aria-label="Search proposals"
                        value={searchTerm}
                        oninput={handleSearch}
                    />
                </div>
                <button class="wg-icon-btn" onclick={handleRefresh} title="Refresh" aria-label="Refresh list">
                    <lightning-icon icon-name="utility:refresh" size="x-small" alternative-text=""></lightning-icon>
                </button>
            </div>
        </div>

        <div class="wg-page-body">

            <!-- ══ ACTIVE FILTER BANNER (from a dashboard tile or a tile click) ══ -->
            <template lwc:if={hasActiveReviewFilter}>
                <div class="info-banner wcf-rq-filter" role="status">
                    <lightning-icon icon-name="utility:filter" size="x-small" alternative-text=""></lightning-icon>
                    <div class="wg-banner-body">
                        Filtered by: <strong>{activeFilterLabel}</strong>
                    </div>
                    <button class="ghost-btn wg-btn-sm wg-banner-action" onclick={handleClearReviewFilter}>
                        <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                        Show all
                    </button>
                </div>
            </template>

            <!-- ══ SUMMARY TILES ═══════════════════════════════════ -->
            <template lwc:if={isLoading}>
                <div class="wg-card">
                    <div class="wg-loading">
                        <lightning-spinner alternative-text="Loading proposals" size="medium"></lightning-spinner>
                        <p class="wg-loading-text">Loading validated proposals…</p>
                    </div>
                </div>
            </template>

            <template lwc:else>
                <div class="wg-stat-grid wcf-rq-stats" role="group" aria-label="Filter by review status">
                    <template for:each={summaryItems} for:item="s">
                        <button key={s.id}
                                class={s.cls}
                                data-filter={s.id}
                                aria-pressed={s.pressed}
                                title="Click to filter"
                                onclick={handleFilterClick}>
                            <span class="wg-stat-head">
                                <span class="wg-stat-label">{s.label}</span>
                                <span class={s.dotCls}></span>
                            </span>
                            <span class="wg-stat-value">{s.count}</span>
                        </button>
                    </template>
                </div>

                <!-- ══ TABLE CARD ══════════════════════════════════ -->
                <div class="wg-card">
                    <template lwc:if={hasProposals}>
                        <div class="wg-table-wrap">
                            <table class="wg-table wcf-rq-table">
                                <thead>
                                    <tr>
                                        <th class="wg-col-index" scope="col">#</th>
                                        <th scope="col" aria-sort={ariaSortName}>
                                            <button class={sortClassName} data-field="Name" onclick={handleSort}>
                                                Application ID
                                                <lightning-icon icon-name={sortIconName} size="xx-small" alternative-text=""></lightning-icon>
                                            </button>
                                        </th>
                                        <th scope="col">Organization</th>
                                        <th scope="col">Headquarters</th>
                                        <th scope="col">Submitter</th>
                                        <th scope="col">Track</th>
                                        <th scope="col">Review status</th>
                                        <template lwc:if={isAcceptedFilterActive}>
                                            <th scope="col">Approver comment</th>
                                        </template>
                                        <th scope="col">Due date</th>
                                        <th class="wg-col-action" scope="col">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={paginatedProposals} for:item="p">
                                        <tr key={p.Id} class={p.rowClass}>
                                            <td class="wg-col-index">{p.sno}</td>
                                            <td class="wg-cell-id">{p.Name}</td>
                                            <td><span class="wcf-trunc" title={p.Organization_Name__c}>{p.Organization_Name__c}</span></td>
                                            <td><span class="wcf-trunc" title={p.Headquarters_City_and_Country__c}>{p.Headquarters_City_and_Country__c}</span></td>
                                            <td><span class="wcf-trunc" title={p.Submitter_Name__c}>{p.Submitter_Name__c}</span></td>
                                            <td>
                                                <div class="wcf-rq-tags">
                                                    <template for:each={p.trackBadges} for:item="tb">
                                                        <span key={tb.code} class={tb.badgeClass} title={tb.label}>{tb.code}</span>
                                                    </template>
                                                </div>
                                            </td>
                                            <td>
                                                <span class={p.reviewBadgeClass}>{p.reviewBadgeLabel}</span>
                                            </td>
                                            <template lwc:if={isAcceptedFilterActive}>
                                                <td>
                                                    <span class="wcf-trunc wcf-trunc-wide" title={p.approverComment}>{p.approverComment}</span>
                                                </td>
                                            </template>
                                            <td>
                                                <span class={p.dueDateClass}>{p.dueDateDisplay}</span>
                                            </td>
                                            <td class="wg-col-action">
                                                <button
                                                    class={p.actionBtnClass}
                                                    data-id={p.Id}
                                                    data-appname={p.Name}
                                                    data-review-id={p.reviewId}
                                                    data-action={p.reviewAction}
                                                    data-headquarters={p.Headquarters_City_and_Country__c}
                                                    data-track={p.trackParam}
                                                    disabled={p.isRejected}
                                                    onclick={handleReviewAction}>
                                                    <lightning-icon icon-name={p.actionIcon} size="xx-small" alternative-text=""></lightning-icon>
                                                    {p.actionLabel}
                                                </button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div class="wg-pagination">
                            <span>Showing {paginationStart}–{paginationEnd} of {filteredCount} proposals</span>
                            <div class="wg-pagination-controls">
                                <button class="wg-icon-btn" onclick={handlePrevPage} disabled={isFirstPage} aria-label="Previous page">
                                    <lightning-icon icon-name="utility:chevronleft" size="xx-small" alternative-text=""></lightning-icon>
                                </button>
                                <template for:each={pageNumbers} for:item="pg">
                                    <button key={pg.num}
                                            class={pg.btnClass}
                                            data-page={pg.num}
                                            aria-current={pg.current}
                                            onclick={handlePageClick}>{pg.num}</button>
                                </template>
                                <button class="wg-icon-btn" onclick={handleNextPage} disabled={isLastPage} aria-label="Next page">
                                    <lightning-icon icon-name="utility:chevronright" size="xx-small" alternative-text=""></lightning-icon>
                                </button>
                            </div>
                            <div class="wcf-rq-pagesize wg-pagesize">
                                <span>Rows per page</span>
                                <!-- FIX: native select — its menu is drawn by the browser above the
                                     page, so the card's rounded-corner clipping can't cut it off
                                     (the lightning-combobox menu was hidden inside the card). -->
                                <select class="wg-pagesize-select"
                                        aria-label="Rows per page"
                                        onchange={handlePageSizeChange}>
                                    <template for:each={pageSizeChoices} for:item="opt">
                                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </template>

                    <!-- Empty -->
                    <template lwc:else>
                        <div class="wg-empty">
                            <lightning-icon icon-name="utility:list" size="large" alternative-text=""></lightning-icon>
                            <p class="wg-empty-title">No proposals found</p>
                            <p class="wg-empty-text">No validated proposals match your current filters.</p>
                            <button class="ghost-btn wg-btn-sm wcf-rq-clear" onclick={handleClearFilters}>Clear filters</button>
                        </div>
                    </template>
                </div>
            </template>

        </div>
    </div>
</template>
