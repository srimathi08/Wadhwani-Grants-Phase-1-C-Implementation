<template>

        <img src={winLogoUrl} alt="WIN Logo" class="win-logo" />

</div>

<template if:true={isSubmitted}>
    <div class="success-container">

        <div class="success-icon">
            <lightning-icon
                icon-name="utility:success"
                size="large"
                variant="success">
            </lightning-icon>
        </div>

        <h1 class="success-title">
            Application Submitted Successfully
        </h1>

        <p class="success-subtitle">
            Thank you for submitting your application to the
            Wadhwani Grants.
        </p>

        <div class="application-card">
            <span class="label">Application ID</span>
            <div class="application-number">
                {applicationNumber}
            </div>
        </div>

        <div class="next-steps">
            <h3>What Happens Next?</h3>

            <div class="step">
                <span class="step-number">1</span>
                <span>Your application has been received.</span>
            </div>

            <div class="step">
                <span class="step-number">2</span>
                <span>Our team will review the submitted information.</span>
            </div>

            <div class="step">
                <span class="step-number">3</span>
                <span>You will receive email communication regarding further actions.</span>
            </div>
        </div>

        <div class="contact-info">
            For any queries, contact :
            <strong>grants.support@wadhwanifoundation.org</strong>
        </div>

        <div class="action-buttons">
            <lightning-button
                variant="brand"
                label="Go to Dashboard"
                onclick={navigateHome}>
            </lightning-button>
        </div>

    </div>
</template>
<template if:false={isSubmitted}>

      <!-- ══ SUBMITTING OVERLAY ══════════════════════════════════ -->
<template if:true={isLoading}>
    <div class="wcf-submit-overlay" role="alert" aria-live="assertive">
        <div class="wcf-submit-modal">
            <svg class="wcf-submit-spinner" viewBox="0 0 50 50">
                <circle class="wcf-submit-spinner-track" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
                <circle class="wcf-submit-spinner-arc" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
            </svg>
            <h2 class="wcf-submit-modal-title">Submitting your application</h2>
            <p class="wcf-submit-modal-sub">This may take a few seconds. Please don't close or refresh this window.</p>
        </div>
    </div>
</template>

  <template if:false={isPage0}>
  <div class="wcf-tracker">
    <template for:each={progressSteps} for:item="step">
      <div key={step.number} class="tracker-step">
        <div class={step.bubbleClass}>
          <template if:true={step.isCompleted}>✓</template>
          <template if:false={step.isCompleted}>{step.number}</template>
        </div>
        <div class={step.labelClass}>{step.label}</div>
        <template if:true={step.connectorClass}>
          <div class={step.connectorClass}></div>
        </template>
      </div>
    </template>
  </div>
</template>

                    ✕
                </button>

            </div>

            <!-- BODY -->

            <div class="ai-modal-body">

                <template if:true={isAiLoading}>

                    <div class="ai-loading-container">

                        <lightning-spinner
                            alternative-text="Generating AI Feedback"
                            size="medium">
                        </lightning-spinner>

                        <p class="ai-loading-text">
                            Generating AI feedback...
                        </p>

                    </div>

                </template>

                <template if:false={isAiLoading}>

                    <div class="ai-response-box">
    <template if:true={formattedAiSections}>
        <template for:each={formattedAiSections} for:item="section">
            
            <div key={section.title} class="ai-section">
                <div class="ai-section-title">
                    {section.title}
                </div>

                <ul class="ai-points">
    <template for:each={section.points} for:item="point">
        <li key={point}>
            <lightning-formatted-rich-text value={point}>
            </lightning-formatted-rich-text>
        </li>
    </template>
</ul>
            </div>

        </template>
    </template>
</div>

                </template>

            </div>

            <!-- FOOTER -->

            <div class="ai-modal-footer">

                <button
                    class="modern-secondary-btn"
                    onclick={closeAIModal}>

                    Close

                </button>

            </div>

        </div>

    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>

</div>

</template>
