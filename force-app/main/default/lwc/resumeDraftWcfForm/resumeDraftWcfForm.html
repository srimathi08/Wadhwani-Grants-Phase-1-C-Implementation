<template> 
    <lightning-card>
          <div class="form-logo-title">
        <img src={winLogoUrl} alt="WIN Logo" class="win-logo" />

</div>
        <div class="slds-p-around_medium centered-form-container">
<!--*************************************  PAGE 1 ****************************************************************  -->
            <template if:true={isPage1}>
                <lightning-formatted-rich-text value={labels.WCF_Paragraph_1}></lightning-formatted-rich-text>
                 <lightning-formatted-rich-text value={labels.WCF_Paragraph_2}></lightning-formatted-rich-text>
               <lightning-formatted-rich-text value={labels.WCF_Paragraph_3}></lightning-formatted-rich-text>
                <lightning-layout class="slds-m-top_medium">
                    <lightning-layout-item size="12">
                        <lightning-combobox
                            name="fundingArea"
                            label={labels.CL_Organizational_Area_s_for_Funding_Investment}
                            value={selectedFundingArea}
                            options={organizationalAreaValues}
                            onchange={handlePicklistChange} required>
                    </lightning-combobox>
                    </lightning-layout-item>
                </lightning-layout>
            </template>

<!--********************************************  PAGE 2 ****************************************************************  -->
            <template if:true={isPage2}>

            <!-- Section Header -->
          <div class="section-header slds-m-top_large">2. {labels.CLS_Organizational_Identifying}</div>

                <div class="form-section">
                    <lightning-input label={labels.CL_Organizational_Name} value={organizationData.Organization_Name__c} data-id="Organization_Name__c" required onchange={handleInput}></lightning-input>
                    <lightning-textarea label={labels.CL_Headquarters_City_and_Country} value={organizationData.Headquarters_City_and_Country__c} data-id="Headquarters_City_and_Country__c" onchange={handleInput} required></lightning-textarea>
                    <lightning-textarea label={labels.CL_Primary_Service_Regions} value={organizationData.Primary_Service_Regions__c} data-id="Primary_Service_Regions__c" onchange={handleInput} required></lightning-textarea>
                    <lightning-input label={labels.CL_Leader_Name} value={organizationData.Leader_Name__c} data-id="Leader_Name__c" onchange={handleInput} required></lightning-input>
                    <lightning-input label={labels.CL_Leader_Title} value={organizationData.Leader_Title__c} data-id="Leader_Title__c" onchange={handleInput} required></lightning-input>
                </div>

                <div class="section-header slds-m-top_large">3. {labels.CLS_Submitter_Contact_Info}</div>

                <!-- Legal Structure -->

    <div class="editor-container">
      <div class="toolbar slds-grid slds-wrap slds-gutters_xx-small slds-align_absolute-center">
        <!-- ...toolbar buttons... -->
                  <!-- Font selection -->
                            <div class="slds-col">
                                <select class="slds-select" onchange={changeFont}>

                                    <option value="Arial">Arial</option>
                                    <option value="Times New Roman">Times New Roman</option>
                                    <option value="Courier New">Courier New</option>
                                </select>
                            </div>
                        
                            <!-- Font Size selection -->
                            <div class="slds-col">
                                <select class="slds-select" onchange={changeFontSize}>
                                    <option value="">Size</option>
                                    <option value="1">Small</option>
                                    <option value="3">Normal</option>
                                    <option value="5">Large</option>
                                    <option value="7">Extra Large</option>
                                </select>
                            </div>
                        
                            <!-- Bold -->
                            <div class="slds-col">
                                <button class="toolbar-button slds-button slds-button_icon" onclick={boldText} title="Bold">
                                    <lightning-icon icon-name="utility:bold" size="x-small"></lightning-icon>
                                </button>
                            </div>
                        
                            <!-- Italic -->
                            <div class="slds-col">
                                <button class="toolbar-button slds-button slds-button_icon" onclick={italicText} title="Italic">
                                    <lightning-icon icon-name="utility:italic" size="x-small"></lightning-icon>
                                </button>
                            </div>
                        
                            <!-- Underline -->
                            <div class="slds-col">
                                <button class="toolbar-button slds-button slds-button_icon" onclick={underlineText} title="Underline">
                                    <lightning-icon icon-name="utility:underline" size="x-small"></lightning-icon>
                                </button>
                            </div>

                                   <!-- Number List -->
                               <div class="slds-col">
                                   <button class="toolbar-button slds-button slds-button_icon" onclick={insertNumberList} title="Numbered List">
                                      <lightning-icon icon-name="utility:number_input" size="x-small"></lightning-icon>
                                   </button>
                               </div>
                        
                                <!-- Bullet List -->
                              <div class="slds-col">
                                   <button class="toolbar-button slds-button slds-button_icon" onclick={insertBulletPoints} title="Bullet List">
                                      <lightning-icon icon-name="utility:list" size="x-small"></lightning-icon>
                                   </button>
                              </div>     

                            <!-- Align Left -->
                            <div class="slds-col">
                                <button class="toolbar-button slds-button slds-button_icon" onclick={alignLeft} title="Align Left">
                                    <lightning-icon icon-name="utility:left_align_text" size="x-small"></lightning-icon>
                                </button>
                            </div>
                        
                            <!-- Align Center -->
                            <div class="slds-col">
                                <button class="toolbar-button slds-button slds-button_icon" onclick={alignCenter} title="Align Center">
                                    <lightning-icon icon-name="utility:center_align_text" size="x-small"></lightning-icon>
                                </button>
                            </div>
                        
                            <!-- Align Right -->
                            <div class="slds-col">
                                <button class="toolbar-button slds-button slds-button_icon" onclick={alignRight} title="Align Right">
                                    <lightning-icon icon-name="utility:right_align_text" size="x-small"></lightning-icon>
                                </button>
                            </div>
      </div>
      <div class="text-area" contenteditable="true" data-field="Legal_Structure__c" aria-label={labels.CL_Legal_Question}
        onclick={setActiveField} oninput={handleInput} onpaste={handlePaste} onkeydown={handleKeyDown}></div>
    </div>
    <p class="error-msg" data-error="Legal_Structure__c"></p>
  </div>
  <div class="slds-col slds-size_12-of-12 slds-m-top_x-small">
    <button class="ai-feedback-btn" onclick={handleAIClick} data-id="Legal_Structure__c">
        ✦ Get AI Feedback
    </button>
</div>

</div>

 </template>
            
<!-- ***********************************  PAGE 3 ********************************************************************* -->

<div class="section-header slds-m-top_large">7. {labels.CLH_Current_Fiscal_Year_Data}</div>

<table class="financial-table slds-m-top_medium">

    <lightning-input variant="label-hidden" class="explanation-input" value={expenseExplanationPreview} placeholder={labels.clickToAddExplanation} onclick={openModal} data-row="Expense_Explanation__c" data-target="fiscal" required></lightning-input> <!--data-row="Expense"-->
</td>
        
    </tr>

    <!-- Net Row (Auto Calculated) -->

        <td>{labels.CL_Revenue_Expense}</td>
        <td><div class="currency-cell"><span class="currency-symbol">$</span>

</td>
    </tr>
</tbody>

</table>

<!-- Modal -->
<!-- Rich Text Modal for Explanation -->
 <template if:true={isModalOpen}>
    <section role="dialog" class="slds-modal slds-fade-in-open custom-modal">
        <div class="custom-modal__container">
            <!-- Modal Header -->
            <header class="custom-modal__header">
                <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                <lightning-button-icon 
                    icon-name="utility:close" 
                    variant="bare" 
                    alternative-text="Close"
                    onclick={closeModal}>
                </lightning-button-icon>
            </header>
            <!-- Modal Content -->
            <div class="custom-modal__content">
                <div class="editor-container">
                    <!-- Toolbar -->
                    <div class="toolbar slds-grid slds-wrap slds-gutters_xx-small slds-align_absolute-center">
                        <div class="slds-col">
                            <select class="slds-select" onchange={changeFont}>
                                <option value="">Font</option>
                                <option value="Arial">Arial</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Courier New">Courier New</option>
                            </select>
                        </div>
                        <div class="slds-col">
                            <select class="slds-select" onchange={changeFontSize}>
                                <option value="">Size</option>
                                <option value="1">Small</option>
                                <option value="3">Normal</option>
                                <option value="5">Large</option>
                                <option value="7">Extra Large</option>
                            </select>
                        </div>
                        <div class="slds-col">
                            <button class="toolbar-button slds-button slds-button_icon" onclick={boldText} title="Bold">
                                <lightning-icon icon-name="utility:bold" size="x-small"></lightning-icon>
                            </button>
                        </div>
                        <div class="slds-col">
                            <button class="toolbar-button slds-button slds-button_icon" onclick={italicText} title="Italic">
                                <lightning-icon icon-name="utility:italic" size="x-small"></lightning-icon>
                            </button>
                        </div>
                        <div class="slds-col">
                            <button class="toolbar-button slds-button slds-button_icon" onclick={underlineText} title="Underline">
                                <lightning-icon icon-name="utility:underline" size="x-small"></lightning-icon>
                            </button>
                        </div>
                        <div class="slds-col">
                            <button class="toolbar-button slds-button slds-button_icon" onclick={insertNumberList} title="Numbered List">
                                <lightning-icon icon-name="utility:number_input" size="x-small"></lightning-icon>
                            </button>
                        </div>
                        <div class="slds-col">
                            <button class="toolbar-button slds-button slds-button_icon" onclick={insertBulletPoints} title="Bullet List">
                                <lightning-icon icon-name="utility:list" size="x-small"></lightning-icon>
                            </button>
                        </div>
                        <div class="slds-col">
                            <button class="toolbar-button slds-button slds-button_icon" onclick={alignLeft} title="Align Left">
                                <lightning-icon icon-name="utility:left_align_text" size="x-small"></lightning-icon>
                            </button>
                        </div>
                        <div class="slds-col">
                            <button class="toolbar-button slds-button slds-button_icon" onclick={alignCenter} title="Align Center">
                                <lightning-icon icon-name="utility:center_align_text" size="x-small"></lightning-icon>
                            </button>
                        </div>
                        <div class="slds-col">
                            <button class="toolbar-button slds-button slds-button_icon" onclick={alignRight} title="Align Right">
                                <lightning-icon icon-name="utility:right_align_text" size="x-small"></lightning-icon>
                            </button>
                        </div>
                    </div>
                    <!-- Editable Text Area -->
                    <div class="text-area" 
                         contenteditable="true" 
                         data-field={modalField}
                         onclick={setActiveField} 
                         oninput={handleInput} 
                         onpaste={handlePaste} 
                         onkeydown={handleKeyDown}>
                        <!-- Optionally insert {modalValue} as innerHTML on modal open -->
                    </div>
                    <p class="error-msg" data-error={modalField}></p>
                </div>
            </div>
            <!-- Modal Footer -->
            <footer class="custom-modal__footer">
                <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                <lightning-button variant="brand" label="Save" onclick={saveModalData} class="slds-m-left_small"></lightning-button>
            </footer>
        </div>
    </section>
    <!-- Modern Backdrop, not old custom one -->
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
