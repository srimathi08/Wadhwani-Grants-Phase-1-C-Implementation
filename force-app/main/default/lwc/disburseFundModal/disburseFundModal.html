<template>
    <div class="slds-backdrop slds-backdrop_open"></div>

    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container custom-modal">

            <!-- HEADER -->
            <header class="slds-modal__header custom-header">
                <h2 class="slds-text-heading_medium slds-text-color_inverse">
                    Disburse Funds
                </h2>
            </header>

            <!-- BODY -->
            <div class="slds-modal__content slds-p-around_large">

                <!-- ROW 1 -->
                <div class="form-row">
                    <lightning-input 
                        class="half-width"
                        label="Name"
                        value={faName}
                        onchange={handleChange}>
                    </lightning-input>

                    <lightning-combobox 
                        class="half-width"
                        label="Funding Type"
                        value={fundingType}
                        options={fundingOptions}
                        onchange={handleFundingTypeChange}>
                    </lightning-combobox>
                </div>

                <!-- ROW 2 -->
                <div class="form-row">
                    <lightning-input 
                        class="half-width"
                        type="number"
                        label="Amount"
                        value={amount}
                        onchange={handleChange}>
                    </lightning-input>

                    <lightning-input 
                        class="half-width"
                        type="date"
                        label="Awarded Date"
                        value={AwardedDate}
                        onchange={handleChange}>
                    </lightning-input>
                </div>

                <!-- Comments Full Width -->
                <div class="full-width">
                    <lightning-textarea 
                        label="Comments"
                        value={comments}
                        onchange={handleChange}>
                    </lightning-textarea>
                </div>

                <!-- Tranche History -->
                <h3 class="slds-m-top_large slds-text-heading_small">Tranche History</h3>

                <lightning-datatable 
                    key-field="Id"
                    data={trancheHistory}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>

            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer custom-footer">
                <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
                <lightning-button variant="brand" label="Submit" onclick={submitForm}></lightning-button>
            </footer>

        </div>
    </section>
</template>
