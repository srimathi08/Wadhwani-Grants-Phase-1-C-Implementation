<template>
    <div class="wg-page ad-page">

        <!-- PAGE HEADER -->
        <div class="wg-page-header">
            <div class="wg-page-heading">
                <p class="wg-page-eyebrow">Approver portal</p>
                <h1 class="wg-page-title">{greeting}, <span class="wg-page-title-accent">Approver</span></h1>
                <p class="wg-page-subtitle">{todayDate}</p>
            </div>
        </div>

        <div class="wg-page-body">

            <!-- KPI TILES — click opens the queue filtered to that bucket -->
            <div class="wg-stat-grid wg-dash-stats" role="group" aria-label="Open the queue filtered by">
                <template for:each={approverCards} for:item="c">
                    <button key={c.id}
                            class={c.kpiClass}
                            data-status={c.status}
                            onclick={handleApproverTileClick}>
                        <span class="wg-stat-head">
                            <span class="wg-stat-label">{c.label}</span>
                            <span class={c.dotClass}></span>
                        </span>
                        <span class="wg-stat-value">{c.count}</span>
                        <span class="wg-stat-caption">{c.subtitle}</span>
                    </button>
                </template>
            </div>

            <!-- PENDING DECISIONS -->
            <div class="wg-section-head">
                <div>
                    <h2 class="wg-section-title">Pending decisions</h2>
                    <p class="wg-section-subtitle">Reviewed proposals awaiting your decision, recommended first</p>
                </div>
                <button class="wg-link" onclick={handleViewAllApproverQueue}>View full queue →</button>
            </div>

            <div class="wg-card">
                <div class="wg-table-wrap">
                    <table class="wg-table ad-table">
                        <thead>
                            <tr>
                                <th class="wg-col-index" scope="col">#</th>
                                <th scope="col">Application ID</th>
                                <th scope="col">Organization</th>
                                <th scope="col">Track</th>
                                <th scope="col">Recommendation</th>
                                <th scope="col">Status</th>
                                <th class="wg-col-action" scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={approverPreviewRows} for:item="row">
                                <tr key={row.applicationId} class={row.rowClass}>
                                    <td class="wg-col-index">{row.rowNum}</td>
                                    <td class="wg-cell-id">{row.applicationName}</td>
                                    <td>{row.organizationName}</td>
                                    <td>
                                        <div class="ad-tags">
                                            <template for:each={row.trackBadges} for:item="tb">
                                                <span key={tb.code} class={tb.pillClass} title={tb.label}>{tb.code}</span>
                                            </template>
                                        </div>
                                    </td>
                                    <td><span class={row.recPillClass}>{row.recommendation}</span></td>
                                    <td><span class={row.statusPillClass}>{row.decisionLabel}</span></td>
                                    <td class="wg-col-action">
                                        <button class={row.actionClass}
                                                data-id={row.applicationId}
                                                data-appname={row.applicationName}
                                                data-review-id={row.reviewId}
                                                data-track={row.track}
                                                data-track-label={row.trackLabel}
                                                disabled={row.actionDisabled}
                                                onclick={handlePreviewApprove}>
                                            <lightning-icon icon-name={row.actionIcon} size="xx-small" alternative-text=""></lightning-icon>
                                            {row.actionLabel}
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            <template lwc:if={noApproverPreviewRows}>
                                <tr>
                                    <td colspan="7" class="wg-table-empty">No proposals awaiting approval decision</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</template>
