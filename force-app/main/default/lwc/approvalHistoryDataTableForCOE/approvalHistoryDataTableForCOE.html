<template>
    <div class="table-container">
        <table class="custom-table">
            <thead>
                <tr>
                    <th>Step</th>
                    <th>Created Date</th>
                    <th>Status</th>
                    <th>Assigned To</th>
                    <th>Comments</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <template for:each={rows} for:item="rec">
                    <tr key={rec.Id}>

                        <td>{rec.Name}</td>
                        <td>{rec.formattedDate}</td>

                        <td>
                            <span class={rec.statusClass}>
                                {rec.Status__c}
                            </span>
                        </td>

                        <td>{rec.Assigned_To_Name__c}</td>

                        <td class="wrap-text">
                            {rec.Comments__c}
                        </td>

                        <td>
                            <button class="share-btn"
                                    data-id={rec.Id}
                                    onclick={handleShare}>
                                Share with PI
                            </button>

                            <button class="share-btn"
                                    data-id={rec.Id}
                                    onclick={openAskWinModal}>
                                Ask to WIN
                            </button>
                        </td>

                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Ask to WIN Modal - INSIDE same root template (VALID) -->
    <template if:true={showAskModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Ask to WIN</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        label="Enter your question/comment"
                        value={askWinComments}
                        onchange={handleAskCommentChange}>
                    </lightning-textarea>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" 
                                      label="Cancel" 
                                      onclick={closeAskWinModal}>
                    </lightning-button>

                    <lightning-button variant="brand" 
                                      label="Submit" 
                                      onclick={submitAskToWin}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
