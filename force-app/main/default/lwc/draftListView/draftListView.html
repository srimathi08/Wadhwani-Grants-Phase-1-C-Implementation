<template>
    <div class="embossed-container">

        <div class="header-title">DRAFT PROJECT PROPOSALS</div>

        <template if:true={draftRecords.length}>
            <div class="table-wrapper">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Application ID</th>
                            <th>Project Title</th>
                            <th>Focus Area</th>
                            <th>Status</th>
                            <th>Last Modified</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template for:each={draftRecords} for:item="rec">
                            <tr key={rec.Id}>
                                <td>{rec.Name}</td>
                                <td>{rec.Project_Title__c}</td>
                                <td>{rec.Primary_Focus_Area__c}</td>
                                <td>{rec.Status}</td>
                                <!--<td>{rec.LastModifiedDate}</td>-->
                                <td>{rec.formattedDate}</td>
                                <td>
                                    <button class="resume-btn"
                                            data-id={rec.Id}
                                            onclick={handleResume}>
                                        Resume Form ↗
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <template if:true={isLoading}>
            <div class="loader-wrapper">
                <lightning-spinner alternative-text="Loading drafts..." size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="error-msg">
                Failed to load draft records. Please try again later.
            </div>
        </template>

    </div>
</template>
