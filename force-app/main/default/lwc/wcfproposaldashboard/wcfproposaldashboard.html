<template>
    <div class="emboss-wrapper">
        <div class="dashboard-title">WCF Proposals Dashboard</div>

        <div class="grid">
            <template for:each={cards} for:item="c">
                <article
                    key={c.id}
                    class={c.combinedClass}
                    data-filter={c.listViewApiName}
                    onclick={handleNavigate}
                    title={c.label}
                >
                    <div class="card-header">
                        <span class="card-title">{c.label}</span>
                        <span class="corner-icon">↗</span>
                    </div>
                    <div class="card-count">{c.count}</div>
                </article>
            </template>
        </div>
    </div>
</template>
