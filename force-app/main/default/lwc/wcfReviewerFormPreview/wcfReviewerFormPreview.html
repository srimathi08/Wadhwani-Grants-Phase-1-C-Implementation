<template>
    <template if:true={isLoading}>
        <div class="wg-loading">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            <p class="wg-loading-text">Loading reviewer scores…</p>
        </div>
    </template>

    <template if:false={isLoading}>
        <template if:true={hasData}>
            <div class="preview-wrap">

                <!-- Header -->
                <div class="preview-card preview-header">
                    <p class="preview-eyebrow">Read-only</p>
                    <h3 class="preview-title">Reviewer evaluation</h3>
                    <div class="preview-meta">
                        <span class="meta-item">
                            <span class="meta-label">Review</span>
                            <strong>{reviewName}</strong>
                        </span>
                        <span class="meta-item">
                            <span class="meta-label">Recommend</span>
                            <span class={recClass}>{recIcon} {recommendation}</span>
                        </span>
                        <template if:true={recStrengthLabel}>
                            <span class="meta-item">
                                <span class="meta-label">Conviction</span>
                                <span class="strength-label">{recStrengthLabel} ({recStrengthNum})</span>
                            </span>
                        </template>
                    </div>
                </div>

                <!-- Overall score (was inline styles) -->
                <div class="score-card">
                    <div>
                        <div class="score-card-label">Overall review score · arithmetic mean</div>
                        <div class="score-card-title">All categories evaluated</div>
                    </div>
                    <div class="score-card-value">
                        <span class="score-card-num">{overallScoreDisplay}</span>
                        <span class="score-card-of">/ 5.0</span>
                    </div>
                </div>

                <!-- Categories -->
                <template for:each={dimensionSummary} for:item="dim">
                    <div key={dim.id} class="preview-card dim-block">
                        <div class="dim-header">
                            <div class="dim-num">{dim.id}</div>
                            <div class="dim-title-wrap">
                                <span class="dim-title">{dim.title}</span>
                                <span class="dim-mean"><span class="meta-label">Mean</span> <strong>{dim.mean}</strong></span>
                            </div>
                        </div>
                        <template for:each={dim.questions} for:item="q">
                            <div key={q.id} class="q-row">
                                <div class="q-text">
                                    <span class="q-id">{q.id}</span>
                                    {q.text}
                                </div>
                                <div class="q-right">
                                    <span class={q.pipClass}>{q.ratingLabel} ({q.rating})</span>
                                    <template if:true={q.ladderText}>
                                        <div class="q-ladder">{q.ladderText}</div>
                                    </template>
                                    <template if:true={q.comment}>
                                        <div class="q-comment">{q.comment}</div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Strengths & weaknesses -->
                <div class="preview-card sw-block">
                    <div class="sw-section">
                        <h5 class="sw-title">Top 3 strengths</h5>
                        <template for:each={strengthList} for:item="s">
                            <div key={s.idx} class="sw-item">
                                <span class="sw-num">{s.num}</span>
                                <span class="sw-text">{s.text}</span>
                            </div>
                        </template>
                        <template if:false={hasStrengths}>
                            <span class="sw-empty">None provided</span>
                        </template>
                    </div>
                    <div class="sw-section">
                        <h5 class="sw-title">Top 3 weaknesses</h5>
                        <template for:each={weaknessList} for:item="w">
                            <div key={w.idx} class="sw-item">
                                <span class="sw-num">{w.num}</span>
                                <span class="sw-text">{w.text}</span>
                            </div>
                        </template>
                        <template if:false={hasWeaknesses}>
                            <span class="sw-empty">None provided</span>
                        </template>
                    </div>
                </div>

                <!-- Recommendation comments -->
                <div class="preview-card rec-block">
                    <h5 class="sw-title">Recommendation comments</h5>
                    <template if:true={recComments}>
                        <p class="rec-comments">{recComments}</p>
                    </template>
                    <template if:false={recComments}>
                        <span class="sw-empty">None provided</span>
                    </template>
                </div>

            </div>
        </template>

        <template if:false={hasData}>
            <div class="wg-card">
                <div class="wg-empty">
                    <lightning-icon icon-name="utility:rating" size="medium" alternative-text=""></lightning-icon>
                    <p class="wg-empty-title">No reviewer evaluation found</p>
                    <p class="wg-empty-text">There is no reviewer evaluation record for this application yet.</p>
                </div>
            </div>
        </template>
    </template>
</template>
