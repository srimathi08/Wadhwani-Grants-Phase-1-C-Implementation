<template>

    <div class="container">

        <div class="header">
            <h2>Reviewer Queries</h2>
        </div>

        <template if:true={data}>
            <div class="table">

                <!-- HEADER -->
                <div class="row header-row">
                    <div class="col-query-number">Query Number</div>
                    <div class="col-proposal">Proposal</div>
                    <div class="col-query">Query</div>
                    <div class="col-actions">Actions</div>
                </div>

                <!-- ROWS -->
                <template for:each={data} for:item="row">
                    <div key={row.Id} class="row">

                        <!-- Query Number (Clickable ✅) -->
                        <div class="col-query-number query-link"
                             data-id={row.Id}
                             data-name={row.queryName}
                             onclick={handleView}>
                            {row.queryName}
                        </div>

                        <!-- Proposal (Clickable ✅) -->
                        <div class="col-proposal proposal-link"
                             data-id={row.proposalId}
                             onclick={handleProposalView}>
                            {row.proposalName}
                        </div>

                        <!-- Query -->
                        <div class="col-query query-text">
                            <lightning-formatted-rich-text value={row.queryText}></lightning-formatted-rich-text>
                        </div>

                        <!-- Actions -->
                        <div class="col-actions actions">

                            <lightning-button 
                                label="Reply"
                                variant="brand"
                                data-id={row.Id}
                                onclick={handleReply}>
                            </lightning-button>

                            <lightning-button 
                                label="Share with PI"
                                variant="outline-brand"
                                data-id={row.Id}
                                onclick={handleSharePI}
                                disabled={row.isSharedWithPI}>
                            </lightning-button>

                        </div>

                    </div>
                </template>

            </div>
        </template>

    </div>

    <!-- REPLY MODAL -->
    <template if:true={showModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2>Reply to Query</h2>
                </header>

                <div class="slds-modal__content">
                    <lightning-textarea 
                        label="Reply"
                        value={replyText}
                        onchange={handleReplyChange}>
                    </lightning-textarea>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Submit" onclick={submitReply}></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- SHARE WITH PI MODAL ✅ -->
    <template if:true={showShareModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2>Share with PI</h2>
                </header>

                <div class="slds-modal__content">
                    <lightning-textarea 
                        label="Comment"
                        value={shareComment}
                        onchange={handleShareCommentChange}>
                    </lightning-textarea>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeShareModal}></lightning-button>
                    <lightning-button variant="brand" label="Submit" onclick={submitSharePI}></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
