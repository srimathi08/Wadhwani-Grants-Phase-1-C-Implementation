<template> 
    <lightning-card>
        
          <div class="form-logo-title">
        <img src={winLogoUrl} alt="WIN Logo" class="win-logo" />
         <h1 class="form-title">{labels.CL_WCF_Form_Title}</h1>
</div>
  <template if:false={isPage0}>
  <div class="wcf-tracker">
    <template for:each={progressSteps} for:item="step">
      <div key={step.number} class="tracker-step">
        <div class={step.bubbleClass}>
          <template if:true={step.isCompleted}>✓</template>
          <template if:false={step.isCompleted}>{step.number}</template>
        </div>
        <div class={step.labelClass}>{step.label}</div>
        <template if:true={step.connectorClass}>
          <div class={step.connectorClass}></div>
        </template>
      </div>
    </template>
  </div>
</template>
        <div class="slds-p-around_medium centered-form-container">





<!-- ================================================================
     wcfOrientationPanel.html
     Add this block BEFORE your existing PAGE 1 template block.
     In your main template, add: <template if:true={isPage0}> wrapper.
     ================================================================ -->

<template if:true={isPage0}>
    <div class="lang-toggle">
    <span class="lang-toggle-label">Language:</span>
    <div class={englishClass} data-lang="en_US" onclick={handleLanguageChange}>
        🇺🇸 EN
    </div>
    <div class={spanishClass} data-lang="es" onclick={handleLanguageChange}>
        🇪🇸 ES
    </div>
    <div class={portugueseClass} data-lang="pt_BR" onclick={handleLanguageChange}>
        🇧🇷 PT
    </div>
</div>

    <!-- ORIENTATION CARDS -->
    <div class="orientation-grid">

        <!-- CARD 1 -->
        <div class="orientation-card">
            <div class="orientation-card-header">
                <div class="orientation-number">1</div>
                <h3>What you'll need</h3>
            </div>
            <ul class="orientation-list">
                <li>Your organization's legal registration details</li>
                <li>3 years of historical financials (revenue and expense)</li>
                <li>3 years of programme outcome numbers (enrolment, placement, jobs)</li>
                <li>Verification reports if you have them (PDF, optional)</li>
                <li>1–2 reference contacts (optional)</li>
            </ul>
        </div>

        <!-- CARD 2 -->
        <div class="orientation-card">
            <div class="orientation-card-header">
                <div class="orientation-number">2</div>
                <h3>Sections in this form</h3>
            </div>
            <ul class="orientation-list">
                <li>About Your Organisation — who you are</li>
                <li>What You Do — your programmes and approach</li>
                <li>What You've Delivered — financials and outcomes</li>
                <li>Why Wadhwani Charitable Foundation — your direction</li>
                <li>Review & Submit — final attestation</li>
            </ul>
        </div>

        <!-- CARD 3 -->
        <div class="orientation-card">
            <div class="orientation-card-header">
                <div class="orientation-number">3</div>
                <h3>Quick tips</h3>
            </div>
            <ul class="orientation-list">
                <li>All amounts in US dollars; rounded to nearest million is fine</li>
                <li>Required fields are marked with a red asterisk *</li>
                <li>Optional fields show a lavender tint with an "(Optional)" label</li>
                <li>Use the AI Feedback button under long-text answers</li>
                <li>You can switch between English, Spanish, and Portuguese anytime</li>
            </ul>
        </div>

        <!-- CARD 4 -->
        <div class="orientation-card">
            <div class="orientation-card-header">
                <div class="orientation-number">?</div>
                <h3>Need help?</h3>
            </div>
            <div class="help-content">
                <p>
                    <strong>Email:</strong>
                    grants-portal@wadhwani-charitable.org
                </p>
                <p>
                    <strong>Response time:</strong>
                    Within 2 business days
                </p>
                <p>
                    <strong>Languages:</strong>
                    English, Spanish, Portuguese
                </p>
            </div>
        </div>

   </div><!-- end orientation-grid -->

<div class="start-form-footer">
    <div class="lang-hint">
        <lightning-icon icon-name="utility:world" size="x-small"></lightning-icon>
        <span>Select your preferred language above before starting</span>
    </div>
    <lightning-button
        variant="brand"
        label="Start Form →"
        onclick={handleStartForm}
        class="start-btn-lwc">
    </lightning-button>
</div>

</template>

                        <div class="modern-section-wrapper">

    <div class="section-step">
        SECTION 1 OF 5
    </div>

    <h1 class="modern-section-title">
        About Your Organisation
    </h1>

    <p class="modern-section-description">
        Tell us who you are. We use this section to understand your organisation’s structure,
        leadership, and the most prominent funders backing your work.
    </p>

    <div class="question-block">

        <div class="question-header">

            <div class="question-number">
                1
            </div>

            <div>
                <div class="question-title">
                    {labels.CL_Organizational_Area_s_for_Funding_Investment}
                    <span class="required">*</span>
                </div>

                <div class="question-subtext">
                    Select the option that best describes your organisation focus.
                </div>
            </div>

        </div>

        <div class="option-grid">

            <template for:each={formattedFundingOptions} for:item="option">

                <div
                    key={option.value}
                    class={option.className}

                    <div class="option-title">
                        {option.label}
                    </div>

                    <div class="option-description">
                        {option.description}
                    </div>

                    <template if:true={option.isSelected}>
                        <div class="selected-check">
                            ✓
                        </div>
                    </template>

                </div>

            </template>

        </div>

    </div>

</div>
                    </lightning-layout-item>

                Tell us how your organisation is legally constituted and where it's registered.
            </div>
        </div>

    </div>

    <div class="modern-form-grid legal-grid">

        <!-- Type -->
        <div class="modern-field">

            <lightning-combobox
                label="Type"
                value={organizationData.Legal_Type__c}
                options={legalTypeOptions}
                data-id="Legal_Type__c"
                onchange={handleInput}
                required>
            </lightning-combobox>

        </div>

        <!-- Jurisdiction -->
        <div class="modern-field">

            <lightning-combobox
                label="Registration Jurisdiction"
                value={organizationData.Registration_Jurisdiction__c}
                options={countryOptions}
                data-id="Registration_Jurisdiction__c"
                onchange={handleInput}
                required>
            </lightning-combobox>

        </div>

        <!-- Date -->
        <div class="modern-field">

            <lightning-input
                type="date"
                label="Incorporation Date"
                value={organizationData.Incorporation_Date__c}
                data-id="Incorporation_Date__c"
                onchange={handleInput}
                required>
            </lightning-input>

        </div>

    </div>

    <!-- Rich Text Area -->

    <div class="modern-richtext-wrapper">

        <div class="modern-richtext-label">
            Brief Description
            <span class="required">*</span>
        </div>

        <div class="modern-richtext-helper">
            Briefly describe your governance and operational structure —
            board, leadership, key affiliations.
        </div>

        <!-- Toolbar -->
        <div class="modern-toolbar">

            <button class="toolbar-min-btn" onclick={boldText}>
                B
            </button>

            <button class="toolbar-min-btn" onclick={italicText}>
                I
            </button>

            <button class="toolbar-min-btn" onclick={underlineText}>
                U
            </button>

            <button class="toolbar-min-btn" onclick={insertBulletPoints}>
                •
            </button>

        </div>

        <!-- Editable Area -->
        <div
            class="modern-richtext-area"
            contenteditable="true"
            data-field="Legal_Structure__c"
            onclick={setActiveField}
            oninput={handleInput}
            onpaste={handlePaste}
            onkeydown={handleKeyDown}>
        </div>

        <!-- Footer -->
        <div class="modern-richtext-footer">

            <button
                class="modern-ai-btn"
                onclick={handleAIClick}
                data-id="Legal_Structure__c">

                ✦ Get AI feedback

            </button>

            <div class="word-counter">
    {legalStructureWordCount} / 100 words
</div>

        </div>

    </div>

</div>

<!-- AI FEEDBACK MODAL -->

<template if:true={isAIModalOpen}>

    <section
        role="dialog"
        tabindex="-1"
        class="ai-modal">

        <div class="slds-modal__container ai-modal-container">

            <!-- HEADER -->

            <div class="ai-modal-header">

                <h2 class="ai-modal-title">
                    ✨ {aiModalTitle}
                </h2>

                <button
                    class="ai-close-btn"
                    onclick={closeAIModal}>

                    ✕
                </button>

            </div>

            <!-- BODY -->

            <div class="ai-modal-body">

                <template if:true={isAiLoading}>

                    <div class="ai-loading-container">

                        <lightning-spinner
                            alternative-text="Generating AI Feedback"
                            size="medium">
                        </lightning-spinner>

                        <p class="ai-loading-text">
                            Generating AI feedback...
                        </p>

                    </div>

                </template>

                <template if:false={isAiLoading}>

                    <div class="ai-response-box">
    <template if:true={formattedAiSections}>
        <template for:each={formattedAiSections} for:item="section">
            
            <div key={section.title} class="ai-section">
                <div class="ai-section-title">
                    {section.title}
                </div>

                <ul class="ai-points">
    <template for:each={section.points} for:item="point">
        <li key={point}>
            <lightning-formatted-rich-text value={point}>
            </lightning-formatted-rich-text>
        </li>
    </template>
</ul>
            </div>

        </template>
    </template>
</div>

                </template>

            </div>

            <!-- FOOTER -->
