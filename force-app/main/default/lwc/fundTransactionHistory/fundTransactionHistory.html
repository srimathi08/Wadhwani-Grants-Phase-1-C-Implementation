<template>
    <lightning-card title={cardTitle} icon-name="standard:transaction">

        <!-- KPI Cards -->
        <div class="slds-grid slds-wrap slds-gutters slds-p-horizontal_medium kpi-row">
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-p-bottom_small">
                <div class="kpi-tile">
                    <p class="kpi-label">Total Grant Received</p>
                    <p class="kpi-value">{formattedTotals.totalGrantReceived}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-p-bottom_small">
                <div class="kpi-tile">
                    <p class="kpi-label">Total Fund Requested</p>
                    <p class="kpi-value">{formattedTotals.totalFundRequested}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-p-bottom_small">
                <div class="kpi-tile">
                    <p class="kpi-label">Total Disbursed</p>
                    <p class="kpi-value">{formattedTotals.totalDisbursed}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-p-bottom_small">
                <div class="kpi-tile">
                    <p class="kpi-label">Total Utilized</p>
                    <p class="kpi-value">{formattedTotals.totalUtilized}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-p-bottom_small">
                <div class="kpi-tile kpi-tile_accent">
                    <p class="kpi-label">Remaining Grant</p>
                    <p class="kpi-value">{formattedTotals.remainingGrant}</p>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="slds-p-horizontal_medium slds-p-bottom_small filter-panel">
            <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6 slds-p-bottom_small">
                    <lightning-input type="date" label="Date From" value={filters.dateFrom}
                                     onchange={handleDateFromChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6 slds-p-bottom_small">
                    <lightning-input type="date" label="Date To" value={filters.dateTo}
                                     onchange={handleDateToChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6 slds-p-bottom_small">
                    <lightning-combobox label="Transaction Type" value={filters.transactionType}
                                        options={transactionTypeOptions} onchange={handleTypeChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6 slds-p-bottom_small">
                    <lightning-input type="text" label="Proposal Name"
                                     value={filters.proposalSearch} onchange={handleProposalSearchChange}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6 slds-p-bottom_small">
                    <lightning-input type="text" label="Milestone Name"
                                     value={filters.milestoneSearch} onchange={handleMilestoneSearchChange}>
                    </lightning-input>
                </div>
            </div>

            <div class="slds-grid slds-grid_align-end slds-p-top_x-small button-row">
                <lightning-button label="Reset" onclick={handleReset}
                                  class="slds-m-right_x-small"></lightning-button>
                <lightning-button label="Search" variant="brand" onclick={handleSearch}
                                  class="slds-m-right_x-small"></lightning-button>
                <lightning-button label="Export Excel" icon-name="utility:download"
                                  onclick={handleExportExcel} class="slds-m-right_x-small"></lightning-button>
                <lightning-button label="Export PDF" onclick={handleExportPdf}></lightning-button>
            </div>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <template if:true={errorMessage}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span>{errorMessage}</span>
                </div>
            </div>
        </template>

        <!-- Legend: only shown when the current page actually has an aggregate row,
             so it never references a label the user can't see on screen. -->
        <template if:true={hasAggregateRows}>
            <div class="slds-p-horizontal_medium slds-p-bottom_x-small legend-row">
                <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                <span class="slds-text-body_small">
                    Rows marked "All Milestones (Aggregate)" show totals summed across every milestone
                    on that proposal, not a single milestone's figures.
                </span>
            </div>
        </template>

        <!-- Data table: 13 columns, so the wrapper scrolls horizontally -->
        <div class="slds-p-horizontal_medium">
            <div class="table-scroll">
                <lightning-datatable
                    key-field="rowId"
                    data={tableRows}
                    columns={columns}
                    column-widths-mode="fixed"
                    hide-checkbox-column
                    show-row-number-column>
                </lightning-datatable>
            </div>
        </div>

        <!-- Pagination -->
        <div class="slds-grid slds-grid_align-spread slds-p-around_medium pagination-row">
            <div class="slds-text-body_small">
                Showing page {pageNumber} of {totalPages} &nbsp;|&nbsp; {totalRecords} records
            </div>
            <div>
                <lightning-button label="Previous" onclick={handlePrevPage} disabled={isFirstPage}
                                  class="slds-m-right_x-small"></lightning-button>
                <lightning-button label="Next" onclick={handleNextPage} disabled={isLastPage}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
