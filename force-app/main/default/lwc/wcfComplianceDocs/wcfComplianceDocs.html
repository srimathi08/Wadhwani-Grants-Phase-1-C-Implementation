<template>

<!-- ── In-page status banner (branded replacement for the platform toast) ── -->
<template if:true={bannerVisible}>
    <div class={bannerClass} role={bannerRole} aria-live="polite">
        <template if:true={isBannerError}><span class="wg-toast-icon error-icon" aria-hidden="true">!</span></template>
        <template if:true={isBannerWarning}><span class="wg-toast-icon warning-icon" aria-hidden="true">&#9650;</span></template>
        <template if:true={isBannerSuccess}><span class="wg-toast-icon success-icon" aria-hidden="true">&#10003;</span></template>
        <template if:true={isBannerInfo}><span class="wg-toast-icon info-icon" aria-hidden="true">i</span></template>
        <p class="wg-toast-body">
            <template if:true={bannerTitleDisplay}><strong class="wg-toast-title">{bannerTitleDisplay}</strong></template>
            {bannerMessage}
        </p>
        <button type="button" class="wg-toast-close" aria-label="Close" onclick={closeBanner}>&#10005;</button>
    </div>
</template>

<lightning-card title="Compliance Documents" icon-name="standard:document">

    <template if:true={isLoading}>
        <div class="comp-loading">
            <lightning-spinner alternative-text="Loading checklist" size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:true={loadError}>
        <div class="comp-error-banner">
            <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
            <p>{loadError}</p>
        </div>
    </template>

    <template if:false={isLoading}>
        <template if:true={hasItems}>

            <!-- ── Overall checklist progress ── -->
            <div class="comp-summary">
                <div class="comp-summary-header">
                    <span class="comp-geography">Checklist for {geography}</span>
                    <span class={overallStatusBadgeClass}>{overallStatusDisplay}</span>
                </div>
                <div class="comp-overall-progress-bar"
                     role="progressbar"
                     aria-valuemin="0"
                     aria-valuemax="100"
                     aria-valuenow={uploadedProgressPercent}
                     aria-label={progressSummaryLabel}>
                    <div class="comp-overall-progress-fill comp-fill-validated"></div>
                    <div class="comp-overall-progress-fill comp-overall-progress-fill--uploaded comp-fill-uploaded"></div>
                </div>
                <p class="comp-summary-label">{progressSummaryLabel}</p>
            </div>

            <!-- ── Final / on-hold reviewer decision (Pass · Reject · Suspend) ── -->
            <template if:true={decisionBanner}>
                <div class={decisionBanner.cssClass} role="status">
                    <lightning-icon icon-name={decisionBanner.icon} size="small"></lightning-icon>
                    <div>
                        <p class="comp-decision-title">{decisionBanner.title}</p>
                        <p>{decisionBanner.message}</p>
                        <template if:true={decisionBanner.notes}>
                            <p class="comp-decision-notes"><strong>Reviewer notes:</strong> {decisionBanner.notes}</p>
                        </template>
                    </div>
                </div>
            </template>

            <!-- ── One row per required document type ── -->
            <template for:each={checklistItems} for:item="item">
                <div key={item.documentType} class="comp-row">

                    <div class="comp-row-header">
                        <div>
                            <span class="comp-doc-label">{item.documentLabel}</span>
                            <template if:true={item.required}>
                                <span class="comp-required-tag">Required</span>
                            </template>
                        </div>
                        <span class={item.badgeClass}>{item.statusLabel}</span>
                    </div>

                    <p class="comp-doc-desc">{item.description}</p>

                    <!-- Returned: the only reviewer decision that reopens the row -->
                    <template if:true={item.isReturned}>
                        <div class="comp-return-banner">
                            <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                            <p><strong>Returned by the compliance team:</strong> {item.reasonText}</p>
                        </div>
                    </template>

                    <template if:true={item.isRefreshRequired}>
                        <div class="comp-return-banner comp-return-banner--refresh">
                            <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                            <p>This document has expired. Please upload a renewed copy below.</p>
                        </div>
                    </template>

                    <template if:true={item.isRejected}>
                        <div class="comp-return-banner comp-return-banner--rejected">
                            <lightning-icon icon-name="utility:ban" size="x-small"></lightning-icon>
                            <p><strong>Rejected by the compliance team:</strong> {item.reasonText}</p>
                        </div>
                    </template>

                    <template if:true={item.isSuspended}>
                        <div class="comp-return-banner comp-return-banner--suspended">
                            <lightning-icon icon-name="utility:pause" size="x-small"></lightning-icon>
                            <p><strong>Suspended pending further review:</strong> {item.reasonText}</p>
                        </div>
                    </template>

                    <template if:true={item.isExpiringSoon}>
                        <div class="comp-return-banner comp-return-banner--warning">
                            <lightning-icon icon-name="utility:clock" size="x-small"></lightning-icon>
                            <p>This document expires on {item.expiryDateFormatted}. {item.expiryHint}</p>
                        </div>
                    </template>

                    <!-- File on record (always viewable, even when locked) -->
                    <template if:true={item.hasFile}>
                        <div class="comp-file-row">
                            <lightning-icon icon-name="doctype:attachment" size="x-small"></lightning-icon>
                            <a href={item.downloadUrl} target="_blank">{item.fileName}</a>
                            <template if:true={item.submittedDateFormatted}>
                                <span class="comp-file-meta">Submitted {item.submittedDateFormatted}</span>
                            </template>
                            <template if:true={item.expiryDateFormatted}>
                                <span class="comp-file-meta">&middot; Valid until {item.expiryDateFormatted}</span>
                            </template>
                        </div>
                    </template>

                    <!-- Why this row can't be changed -->
                    <template if:true={item.lockedHint}>
                        <p class="comp-locked-hint">
                            <lightning-icon icon-name="utility:lock" size="xx-small"></lightning-icon>
                            <span>{item.lockedHint}</span>
                        </p>
                    </template>

                    <!-- Upload controls (editable rows only) -->
                    <template if:true={item.canUpload}>
                        <template if:true={item.uploadRecordId}>
                            <div class="comp-upload-row">
                                <lightning-input
                                    type="date"
                                    label="Document expiry date (optional)"
                                    data-doctype={item.documentType}
                                    onchange={handleExpiryDateChange}
                                    class="comp-expiry-input">
                                </lightning-input>
                                <lightning-file-upload
                                    label="Upload document"
                                    name="complianceFileUpload"
                                    accept=".pdf,.png,.jpg,.jpeg"
                                    record-id={item.uploadRecordId}
                                    data-doctype={item.documentType}
                                    data-record-id={item.uploadRecordId}
                                    onuploadfinished={handleUploadFinished}>
                                </lightning-file-upload>
                                <template if:true={item.isReplacing}>
                                    <lightning-button
                                        variant="base"
                                        label="Cancel"
                                        data-doctype={item.documentType}
                                        onclick={handleCancelReplace}>
                                    </lightning-button>
                                </template>
                            </div>
                        </template>
                        <template if:false={item.uploadRecordId}>
                            <div class="comp-upload-row">
                                <lightning-button
                                    variant="brand"
                                    label="Prepare upload"
                                    data-doctype={item.documentType}
                                    onclick={handlePrepareUpload}
                                    disabled={item.isPreparing}>
                                </lightning-button>
                                <template if:true={item.isPreparing}>
                                    <lightning-spinner alternative-text="Preparing" size="small"></lightning-spinner>
                                </template>
                            </div>
                        </template>
                    </template>

                    <!-- Replace / Delete: saved drafts only -->
                    <template if:true={item.showReplace}>
                        <div class="comp-replace-row">
                            <lightning-button
                                variant="base"
                                label="Replace document"
                                data-doctype={item.documentType}
                                onclick={handleReplaceClick}
                                class="comp-replace-btn">
                            </lightning-button>
                            <template if:true={item.showDelete}>
                                <lightning-button
                                    variant="destructive-text"
                                    label="Delete document"
                                    data-doctype={item.documentType}
                                    data-record-id={item.recordId}
                                    onclick={handleDeleteClick}
                                    class="comp-delete-btn">
                                </lightning-button>
                            </template>
                        </div>
                    </template>

                    <template if:true={item.isUploadingThis}>
                        <lightning-spinner alternative-text="Uploading" size="small"></lightning-spinner>
                    </template>
                </div>
            </template>

            <!-- ── Draft & Submission Footer (hidden once Pass / Reject / Suspend) ── -->
            <template if:true={showActionFooter}>
                <div class="comp-footer">
                    <div class="comp-footer-status">
                        <span class="comp-footer-count">{uploadProgressText}</span>
                        <template if:false={allDocumentsUploaded}>
                            <span class="comp-footer-hint">Upload all required documents to enable submission for compliance review.</span>
                        </template>
                        <template if:true={allDocumentsUploaded}>
                            <span class="comp-footer-hint comp-footer-hint--ready">All required documents uploaded. Ready to submit for review.</span>
                        </template>
                    </div>
                    <div class="comp-footer-actions">
                        <lightning-button
                            label="Save Draft"
                            icon-name="utility:save"
                            variant="neutral"
                            onclick={handleSaveDraft}
                            class="comp-btn-draft">
                        </lightning-button>
                        <lightning-button
                            label="Submit Compliance Documents"
                            icon-name="utility:send"
                            variant="brand"
                            onclick={handleSubmit}
                            disabled={isSubmitDisabled}
                            class="comp-btn-submit">
                        </lightning-button>
                    </div>
                </div>
            </template>

        </template>
    </template>

</lightning-card>
</template>
