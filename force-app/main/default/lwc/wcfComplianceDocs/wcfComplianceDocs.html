<template>
    <!-- ══ WG TOAST BANNER ══════════════════════════════════
         Replaces native ShowToastEvent (renders outside the shadow tree and
         cannot be restyled). JS infrastructure already added in
         wcfComplianceDocs.js. Renders at the very top level, fixed
         position, so it floats above the loading spinner and every row. -->
    <template if:true={bannerVisible}>
        <div class={bannerClass}>
            <template if:true={isBannerError}>
                <svg class="wg-toast-banner-icon" viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm.75 13.25h-1.5v-1.5h1.5v1.5zm0-3h-1.5V5.75h1.5v5.5z"></path>
                </svg>
            </template>
            <template if:true={isBannerWarning}>
                <svg class="wg-toast-banner-icon" viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path d="M10.91 2.6a1 1 0 00-1.82 0l-8 16A1 1 0 002 20h16a1 1 0 00.91-1.4l-8-16zM11 16H9v-2h2v2zm0-4H9V7h2v5z"></path>
                </svg>
            </template>
            <template if:true={isBannerSuccess}>
                <svg class="wg-toast-banner-icon" viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm-1.2 13L4.6 9.8l1.4-1.4 2.8 2.8 5.2-5.2 1.4 1.4L8.8 14z"></path>
                </svg>
            </template>
            <template if:true={isBannerInfo}>
                <svg class="wg-toast-banner-icon" viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm.75 13.25h-1.5V8.75h1.5v5.5zm0-7h-1.5v-1.5h1.5v1.5z"></path>
                </svg>
            </template>
            <div class="wg-toast-banner-body">
                <div class="wg-toast-banner-title">{bannerTitle}</div>
                <div class="wg-toast-banner-message">{bannerMessage}</div>
            </div>
            <button class="wg-toast-banner-close" onclick={handleDismissBanner} title="Dismiss" type="button">&#10005;</button>
        </div>
    </template>

<lightning-card title="Compliance Documents" icon-name="standard:document">

    <template if:true={isLoading}>
        <div class="comp-loading">
            <lightning-spinner alternative-text="Loading checklist" size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:true={loadError}>
        <div class="comp-error-banner">
            <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
            <p>{loadError}</p>
        </div>
    </template>

    <template if:false={isLoading}>
        <template if:true={hasItems}>

            <!-- ── Compliance Decision (Passed / Rejected / Suspended / Returned) ──
                 BUG FIX: this component's CSS (.decision-banner*, .comments-section,
                 .reviewer-comments, .footer-note) and JS (showPassedBanner /
                 showRejectedBanner / showSuspendedBanner / showReturnedBanner
                 getters, the complianceReviewerNotes tracked property, already
                 fetched from Apex) were both fully built for this banner, but the
                 HTML template never actually rendered it anywhere — the compliance
                 team's decision and reviewer comments were silently invisible to
                 the applicant. Wired up here using the existing getters/classes
                 exactly as they were already defined. -->
            <template if:true={showPassedBanner}>
                <div class="decision-banner decision-banner--passed">
                    <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                    <div class="decision-content">
                        <strong>Compliance documents validated</strong>
                        <p>All required compliance documents have been reviewed and approved.</p>
                    </div>
                </div>
            </template>

            <template if:true={showRejectedBanner}>
                <div class="decision-banner decision-banner--rejected">
                    <lightning-icon icon-name="utility:ban" size="small"></lightning-icon>
                    <div class="decision-content">
                        <strong>Compliance documents rejected</strong>
                        <template if:true={complianceReviewerNotes}>
                            <div class="comments-section">
                                <strong>Reviewer comments:</strong>
                                <p class="reviewer-comments">{complianceReviewerNotes}</p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template if:true={showSuspendedBanner}>
                <div class="decision-banner decision-banner--suspended">
                    <lightning-icon icon-name="utility:pause" size="small" class="decision-icon-suspended"></lightning-icon>
                    <div class="decision-content">
                        <strong>Compliance review suspended</strong>
                        <template if:true={complianceReviewerNotes}>
                            <div class="comments-section">
                                <strong>Reviewer comments:</strong>
                                <p class="reviewer-comments">{complianceReviewerNotes}</p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template if:true={showReturnedBanner}>
                <div class="decision-banner decision-banner--returned">
                    <lightning-icon icon-name="utility:warning" size="small" class="decision-icon-returned"></lightning-icon>
                    <div class="decision-content">
                        <strong>Action needed on compliance documents</strong>
                        <template if:true={complianceReviewerNotes}>
                            <div class="comments-section">
                                <strong>Reviewer comments:</strong>
                                <p class="reviewer-comments">{complianceReviewerNotes}</p>
                            </div>
                        </template>
                        <p class="footer-note">Please review the item-level notes below and re-upload the affected document(s).</p>
                    </div>
                </div>
            </template>

            <!-- ── Overall checklist progress ── -->
            <div class="comp-summary">
                <div class="comp-summary-header">
                    <span class="comp-geography">Checklist for {geography}</span>
                    <span class={overallStatusBadgeClass}>{overallStatusDisplay}</span>
                </div>
                <div class="comp-overall-progress-bar">
                    <div class="comp-overall-progress-fill" style={overallProgressStyle}></div>
                </div>
                <p class="comp-summary-label">{progressSummaryLabel}</p>
            </div>

            <!-- ── One row per required document type ── -->
            <template for:each={checklistItems} for:item="item">
                <div key={item.documentType} class="comp-row">

                    <div class="comp-row-header">
                        <div>
                            <span class="comp-doc-label">{item.documentLabel}</span>
                            <template if:true={item.required}>
                                <span class="comp-required-tag">Required</span>
                            </template>
                        </div>
                        <span class={item.badgeClass}>{item.statusLabel}</span>
                    </div>

                    <p class="comp-doc-desc">{item.description}</p>

                    <!-- Returned by the Compliance Reviewer -->
                    <template if:true={item.isReturned}>
                        <div class="comp-return-banner">
                            <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                            <p><strong>Returned by the compliance team:</strong> {item.returnReason}</p>
                        </div>
                    </template>

                    <!-- Expired, needs refresh -->
                    <template if:true={item.isRefreshRequired}>
                        <div class="comp-return-banner comp-return-banner--refresh">
                            <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                            <p>This document has expired and needs to be re-uploaded.</p>
                        </div>
                    </template>

                    <template if:true={item.isRejected}>
    <div class="comp-return-banner comp-return-banner--rejected">
        <lightning-icon icon-name="utility:ban" size="x-small"></lightning-icon>
        <p><strong>Rejected by the compliance team:</strong> {item.returnReason}</p>
    </div>
</template>

<template if:true={item.isSuspended}>
    <div class="comp-return-banner comp-return-banner--suspended">
        <lightning-icon icon-name="utility:pause" size="x-small"></lightning-icon>
        <p><strong>Suspended pending further review:</strong> {item.returnReason}</p>
    </div>
</template>

                    <!-- Expiring soon, not yet flagged -->
                    <template if:true={item.isExpiringSoon}>
                        <div class="comp-return-banner comp-return-banner--warning">
                            <lightning-icon icon-name="utility:clock" size="x-small"></lightning-icon>
                            <p>This document expires on {item.expiryDateFormatted}. Consider uploading a renewed copy soon.</p>
                        </div>
                    </template>

                    <!-- Already-submitted file -->
                    <template if:true={item.hasFile}>
                        <div class="comp-file-row">
                            <lightning-icon icon-name="doctype:attachment" size="x-small"></lightning-icon>
                            <a href={item.downloadUrl} target="_blank">{item.fileName}</a>
                            <template if:true={item.submittedDateFormatted}>
                                <span class="comp-file-meta">Submitted {item.submittedDateFormatted}</span>
                            </template>
                            <template if:true={item.expiryDateFormatted}>
                                <span class="comp-file-meta">&middot; Valid until {item.expiryDateFormatted}</span>
                            </template>
                        </div>
                    </template>

                    <!-- Upload controls -->
                    <!-- 
                        FIX: record-id now uses item.uploadRecordId (the WCF_Compliance_Document__c Id)
                        NOT the IndividualApplication Id. Community users can access the compliance
                        doc record directly; they cannot access IndividualApplication via lightning-file-upload.
                        item.uploadRecordId is pre-created by getOrCreateComplianceRecord in Apex
                        before the uploader renders, so it is always a valid Id.
                    -->
                    <template if:true={item.canUpload}>
                        <template if:true={item.uploadRecordId}>
                            <div class="comp-upload-row">
                                <lightning-input
                                    type="date"
                                    label="Document expiry date (optional)"
                                    data-doctype={item.documentType}
                                    onchange={handleExpiryDateChange}
                                    class="comp-expiry-input">
                                </lightning-input>
                                <lightning-file-upload
                                    label="Upload document"
                                    name="complianceFileUpload"
                                    accept=".pdf,.png,.jpg,.jpeg"
                                    record-id={item.uploadRecordId}
                                    data-doctype={item.documentType}
                                     data-record-id={item.uploadRecordId}
                                    onuploadfinished={handleUploadFinished}>
                                </lightning-file-upload>
                            </div>
                        </template>
                        <template if:false={item.uploadRecordId}>
                            <!-- Shell record not yet created — show a prepare button -->
                            <div class="comp-upload-row">
                                <lightning-button
                                    variant="brand"
                                    label="Prepare upload"
                                    data-doctype={item.documentType}
                                    onclick={handlePrepareUpload}
                                    disabled={item.isPreparing}
                                    class="comp-btn-prepare">
                                </lightning-button>
                                <template if:true={item.isPreparing}>
                                    <lightning-spinner alternative-text="Preparing" size="small"></lightning-spinner>
                                </template>
                            </div>
                        </template>
                    </template>

                    <template if:true={item.showReplace}>
                        <div class="comp-replace-row">
                            <lightning-button
                                variant="base"
                                label="Replace document"
                                data-doctype={item.documentType}
                                onclick={handleReplaceClick}
                                class="comp-replace-btn">
                            </lightning-button>
                            <lightning-button
                                variant="destructive-text"
                                label="Delete document"
                                data-doctype={item.documentType}
                                data-record-id={item.recordId}
                                onclick={handleDeleteClick}
                                class="comp-delete-btn">
                            </lightning-button>
                        </div>
                    </template>

                    <template if:true={item.isUploadingThis}>
                        <lightning-spinner alternative-text="Uploading" size="small"></lightning-spinner>
                    </template>
                </div>
            </template>

            <!-- ── Draft & Submission Footer ── -->
            <template if:true={showActionFooter}>
                <div class="comp-footer">
                    <div class="comp-footer-status">
                        <span class="comp-footer-count">{uploadProgressText}</span>
                        <template if:false={allDocumentsUploaded}>
                            <span class="comp-footer-hint">Upload all required documents to enable submission for compliance review.</span>
                        </template>
                        <template if:true={allDocumentsUploaded}>
                            <span class="comp-footer-hint comp-footer-hint--ready">All required documents uploaded. Ready to submit for review.</span>
                        </template>
                    </div>
                    <div class="comp-footer-actions">
                        <lightning-button
                            label="Save Draft"
                            icon-name="utility:save"
                            variant="neutral"
                            onclick={handleSaveDraft}
                            class="comp-btn-draft">
                        </lightning-button>
                        <lightning-button
                            label="Submit Compliance Documents"
                            icon-name="utility:send"
                            variant="brand"
                            onclick={handleSubmit}
                            disabled={isSubmitDisabled}
                            class="comp-btn-submit">
                        </lightning-button>
                    </div>
                </div>
            </template>

        </template>
    </template>

</lightning-card>
</template>
