<template>
    <div class="slds-backdrop slds-backdrop_open"></div>

    <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container custom-modal">

            <header class="slds-modal__header modal-header">
                <h2>Disburse to Milestone</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <lightning-input label="Milestone" value={milestoneName} disabled></lightning-input>

                <lightning-input type="datetime" 
                                 label="Disbursement Date"
                                 value={disbursementDate}
                                 onchange={handleChange}>
                </lightning-input>

                <lightning-input type="number"
                                 label="Amount"
                                 value={amount}
                                 onchange={handleChange}>
                </lightning-input>

                <lightning-textarea 
                                 label="Comments"
                                 value={comments}
                                 onchange={handleChange}>
                </lightning-textarea>

                <h3 class="doc-title">Required Documents</h3>

                <template for:each={documents} for:item="doc">
                    <div key={doc.id} class="doc-row">
                        <lightning-input 
                            data-id={doc.id}
                            value={doc.value}
                            onchange={updateDocument}>
                        </lightning-input>
                    </div>
                </template>

                <lightning-button 
                    label="Add Document" 
                    onclick={addDocument}>
                </lightning-button>

            </div>

            <footer class="slds-modal__footer modal-footer">
                <lightning-button label="Close" onclick={closeModal}></lightning-button>
                <lightning-button variant="brand" label="Submit" onclick={submitForm}></lightning-button>
            </footer>

        </div>
    </section>
</template>
