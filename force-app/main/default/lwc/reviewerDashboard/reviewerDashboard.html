<template>
    <!-- Main Dashboard Container -->
    <div class="dashboard-container">
        
        <!-- Onboarding Progress Section (Always visible at top) -->
        <div class="onboarding-section">
            <lightning-card>
                <div class="progress-header">
                    <h2 class="section-title">Your Onboarding Journey</h2>
                </div>

                <!-- Progress Stepper -->
                <div class="stepper-container">
                    <!-- Step 1: Registration -->
                    <div class="step-wrapper">
                        <div class="step-item">
                            <div class={registrationStepClass}>
                                <lightning-icon 
                                    if:true={reviewerRegistered}
                                    icon-name="utility:check" 
                                    size="x-small" 
                                    class="step-icon-check">
                                </lightning-icon>
                                <span if:false={reviewerRegistered} class="step-number">1</span>
                            </div>
                            <div class="step-label">
                                <span class="step-title">Registration</span>
                                <span class="step-status">{reviewerOnboardingStatusText}</span>
                            </div>
                        </div>
                        <div class={step1LineClass}></div>
                    </div>

                    <!-- Step 2: NDA -->
                    <div class="step-wrapper">
                        <div class="step-item">
                            <div class={ndaStepClass}>
                                <lightning-icon 
                                    if:true={ndaCompleted}
                                    icon-name="utility:check" 
                                    size="x-small" 
                                    class="step-icon-check">
                                </lightning-icon>
                                <span if:false={ndaCompleted} class="step-number">2</span>
                            </div>
                            <div class="step-label">
                                <span class="step-title">NDA Signature</span>
                                <span class="step-status">{ndaStatusText}</span>
                            </div>
                        </div>
                        <div class={step2LineClass}></div>
                    </div>

                    <!-- Step 3: Active Reviewer -->
                    <div class="step-wrapper">
                        <div class="step-item">
                            <div class={activeStepClass}>
                                <lightning-icon 
                                    if:true={showStartReview}
                                    icon-name="utility:check" 
                                    size="x-small" 
                                    class="step-icon-check">
                                </lightning-icon>
                                <span if:false={showStartReview} class="step-number">3</span>
                            </div>
                            <div class="step-label">
                                <span class="step-title">Active Reviewer</span>
                                <span class="step-status">{activeStatusText}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Status Banner -->
                <template if:false={reviewerRegistered}>
                    <div class="status-banner banner-warning">
                        <lightning-icon icon-name="utility:info" size="small" class="banner-icon"></lightning-icon>
                        <div class="banner-content">
                            <h3 class="banner-title">Complete Your Registration</h3>
                            <p class="banner-text">Please register to begin your reviewer onboarding process.</p>
                            <lightning-button 
                                label="Register Now" 
                                variant="brand" 
                                onclick={handleRegistrationClick}
                                class="banner-button">
                            </lightning-button>
                        </div>
                    </div>
                </template>

                <template if:true={reviewerRegistered}>
                    <template if:false={ndaCompleted}>
                        <div class="status-banner banner-info">
                            <lightning-icon icon-name="utility:contract" size="small" class="banner-icon"></lightning-icon>
                            <div class="banner-content">
                                <h3 class="banner-title">NDA Signature Required</h3>
                                <p class="banner-text">Status: {ndaStatusText}. The admin team will process your NDA.</p>
                            </div>
                        </div>
                    </template>
                </template>

                <template if:true={showStartReview}>
                    <div class="status-banner banner-success">
                        <lightning-icon icon-name="utility:success" size="small" class="banner-icon"></lightning-icon>
                        <div class="banner-content">
                            <h3 class="banner-title">You're All Set!</h3>
                            <p class="banner-text">Your onboarding is complete. You can now start reviewing applications.</p>
                        </div>
                    </div>
                </template>
            </lightning-card>
        </div>

        <!-- Dashboard Content -->
        <template if:true={showDashboard}>
            <div class="dashboard-title">
                <h2 class="section-title">My Review Dashboard</h2>
            </div>

            <div class="metrics-grid">

                <!-- Total Assigned -->
                <lightning-card class="metric-card">
                    <div class="card-content">
                        <div class="metric-header">
                            <div class="icon-wrapper icon-blue">
                                <lightning-icon icon-name="standard:task2" size="medium"></lightning-icon>
                            </div>
                            <div class="metric-info">
                                <span class="metric-label">Total Assigned</span>
                                <span class="metric-value">{totalAssigned}</span>
                            </div>
                        </div>
                        <div class="metric-footer">
                            <span class="footer-link" onclick={handleTotalClick}>
                                View All →
                            </span>
                        </div>
                    </div>
                </lightning-card>

                <!-- Yet to Start -->
                <lightning-card class="metric-card">
                    <div class="card-content">
                        <div class="metric-header">
                            <div class="icon-wrapper icon-orange">
                                <lightning-icon icon-name="utility:pause" size="medium"></lightning-icon>
                            </div>
                            <div class="metric-info">
                                <span class="metric-label">Yet to Start</span>
                                <span class="metric-value metric-warning">{yetToStart}</span>
                            </div>
                        </div>
                        <div class="metric-footer">
                            <span class="footer-link" onclick={handleYetToStartClick}>
                                Start Review →
                            </span>
                        </div>
                    </div>
                </lightning-card>

                <!-- In Progress -->
                <lightning-card class="metric-card">
                    <div class="card-content">
                        <div class="metric-header">
                            <div class="icon-wrapper icon-blue">
                                <lightning-icon icon-name="utility:edit" size="medium"></lightning-icon>
                            </div>
                            <div class="metric-info">
                                <span class="metric-label">In Progress</span>
                                <span class="metric-value">{draftCount}</span>
                            </div>
                        </div>
                        <div class="metric-footer">
                            <span class="footer-link" onclick={handleDraftClick}>
                                View Drafts →
                            </span>
                        </div>
                    </div>
                </lightning-card>

                <!-- Completed -->
                <lightning-card class="metric-card">
                    <div class="card-content">
                        <div class="metric-header">
                            <div class="icon-wrapper icon-green">
                                <lightning-icon icon-name="utility:check" size="medium"></lightning-icon>
                            </div>
                            <div class="metric-info">
                                <span class="metric-label">Completed</span>
                                <span class="metric-value metric-success">{submitted}</span>
                            </div>
                        </div>
                        <div class="metric-footer">
                            <span class="footer-link" onclick={handleReviewedClick}>
                                View History →
                            </span>
                        </div>
                    </div>
                </lightning-card>

            </div>
        </template>

        <!-- Error Handling -->
        <template if:true={error}>
            <div class="error-banner">
                <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
                <span>Error loading dashboard data. Please refresh the page.</span>
            </div>
        </template>

    </div>
</template>
