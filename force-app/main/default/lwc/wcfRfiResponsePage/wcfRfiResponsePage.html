<template>
    <div class="rfi-response-wrapper">

        <!-- ── LOADING ── -->
        <template if:true={isLoading}>
            <div class="rfi-loading-box">
                <lightning-spinner alternative-text="Loading revision data..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- ── SUBMITTED ── -->
        <template if:true={isSubmitted}>
            <div class="rfi-success-container">
                <div class="rfi-success-icon-wrap">
                    <lightning-icon icon-name="utility:success" size="large" variant="success"></lightning-icon>
                </div>
                <h1 class="rfi-success-title">Revision Submitted Successfully</h1>
                <p class="rfi-success-sub">
                    Your answers for Application <strong>{applicationName}</strong> have been updated and resubmitted.
                    The validator has been notified to resume their review.
                </p>
                <button class="btn-primary-red" onclick={handleBackToDashboard}>Back to Dashboard</button>
            </div>
        </template>

        <!-- ── REVISION QUESTIONNAIRE ── -->
        <template if:false={isSubmitted}>
            <template if:false={isLoading}>

                <div class="rfi-header-banner">
                    <div class="rfi-header-icon-wrap">
                        <lightning-icon icon-name="utility:warning" size="small" variant="warning"></lightning-icon>
                    </div>
                    <div>
                        <h1 class="rfi-header-title">Revision Requested — Application {applicationName}</h1>
                        <p class="rfi-header-sub">
                            Please review the validator feedback notes below and update only the returned questions.
                            All other answers in your application remain unchanged.
                        </p>
                    </div>
                </div>

                <div class="rfi-questions-container">
                    <template if:true={hasFlaggedQuestions}>
                        <template for:each={flaggedQuestions} for:item="q">
                            <div key={q.key} class="rfi-question-card" data-qkey={q.key}>

                                <!-- Validator note -->
                                <div class="rfi-validator-note">
                                    <div class="rfi-note-icon">
                                        <lightning-icon icon-name="utility:announcement" size="xx-small" variant="error"></lightning-icon>
                                    </div>
                                    <div class="rfi-note-content">
                                        <span class="rfi-note-qref">Question {q.displayNumber} — {q.title}</span>
                                        <div class="rfi-note-text">
                                            <strong>Validator Note:</strong> {q.returnText}
                                        </div>
                                    </div>
                                </div>

                                <div class="rfi-field-area">

                                    <!-- ═════════ Q1: Track selection (read-only) ═════════ -->
                                    <template if:true={q.isQ1}>
                                        <p class="rfi-field-hint">Selected tracks for your organization's application (read-only):</p>
                                        <div class="rfi-grid-three">
                                            <template for:each={trackCards} for:item="trk">
                                                <div key={trk.code} class={trk.cssClass}>
                                                    <div class="custom-checkbox">
                                                        <template if:true={trk.isSelected}>✓</template>
                                                    </div>
                                                    <span class="track-label-text">{trk.label}</span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- ═════════ Q2: Organizational identifying info ═════════ -->
                                    <template if:true={q.isQ2}>
                                        <div class="rfi-grid-two">
                                            <lightning-input label="Organizational Name" value={formValues.Organization_Name__c}
                                                data-field="Organization_Name__c" disabled></lightning-input>

                                            <div class="location-autocomplete-container">
                                                <lightning-input label="Headquarters City and Country"
                                                    value={formValues.Headquarters_City_and_Country__c}
                                                    data-field="Headquarters_City_and_Country__c"
                                                    onchange={handleLocationInput}
                                                    onblur={handleLocationBlur}
                                                    autocomplete="off"
                                                    placeholder="Type city or country..."
                                                    required>
                                                </lightning-input>
                                                <p class="subtext-muted rfi-hint-small">e.g., "Chennai, India"</p>
                                                <template if:true={isSearchingLocation}>
                                                    <div class="location-searching">Searching…</div>
                                                </template>
                                                <template if:true={showLocationDropdown}>
                                                    <ul class="location-dropdown">
                                                        <template for:each={locationResults} for:item="loc">
                                                            <li key={loc.value} data-value={loc.value} onmousedown={handleSelectLocation}>
                                                                <span class="location-city">{loc.label}</span>
                                                                <span class="location-detail">{loc.subDisplay}</span>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </template>
                                            </div>

                                            <div class="rfi-full-width">
                                                <lightning-input label="Primary Service Regions"
                                                    value={formValues.Primary_Service_Regions__c}
                                                    data-field="Primary_Service_Regions__c"
                                                    onchange={handleFieldChange}
                                                    required></lightning-input>
                                                <p class="subtext-muted rfi-hint-small">Where do you operate? List all states, provinces, or regions in priority order.</p>
                                            </div>

                                            <lightning-input label="Leader Name" value={formValues.Leader_Name__c}
                                                data-field="Leader_Name__c" onchange={handleFieldChange} required></lightning-input>

                                            <lightning-input label="Leader Title" value={formValues.Leader_Title__c}
                                                data-field="Leader_Title__c" onchange={handleFieldChange} required></lightning-input>

                                            <div>
                                                <lightning-input label="Leader Tenure (Optional)" value={formValues.Leader_Tenure__c}
                                                    data-field="Leader_Tenure__c" onchange={handleFieldChange}
                                                    type="number" min="0" max="99" step="1"></lightning-input>
                                                <p class="subtext-muted rfi-hint-small">Number of years your current named leader has held their role. Round to the nearest year.</p>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- ═════════ Q3: Submitter contact ═════════ -->
                                    <template if:true={q.isQ3}>
                                        <div class="rfi-grid-two">
                                            <lightning-input label="Submitter Name" value={formValues.Submitter_Name__c}
                                                data-field="Submitter_Name__c" disabled></lightning-input>
                                            <lightning-input label="Job Title" value={formValues.Job_Title__c}
                                                data-field="Job_Title__c" onchange={handleFieldChange} required></lightning-input>
                                            <lightning-input type="email" label="Work Email" value={formValues.Work_Email_ID__c}
                                                data-field="Work_Email_ID__c" disabled></lightning-input>
                                            <lightning-input type="tel" label="Phone Number" value={formValues.Phone__c}
                                                data-field="Phone__c" disabled></lightning-input>
                                        </div>
                                    </template>

                                    <!-- ═════════ Q4: Legal structure ═════════ -->
                                    <template if:true={q.isQ4}>
                                        <div class="rfi-grid-two">
                                            <div>
                                                <lightning-combobox label="Legal Structure" value={formValues.Legal_Type__c}
                                                    options={legalTypeOptions} data-field="Legal_Type__c"
                                                    onchange={handleFieldChange} required></lightning-combobox>
                                                <template if:true={isLegalTypeOther}>
                                                    <div class="rfi-stack-gap">
                                                        <lightning-input label="Please specify your legal structure type"
                                                            value={formValues.Legal_Type_Other__c} data-field="Legal_Type_Other__c"
                                                            maxlength="255" onchange={handleFieldChange} required></lightning-input>
                                                    </div>
                                                </template>
                                            </div>
                                            <div>
                                                <lightning-combobox label="Registration Jurisdiction" value={formValues.Registration_Jurisdiction__c}
                                                    options={countryOptions} data-field="Registration_Jurisdiction__c"
                                                    onchange={handleFieldChange} required></lightning-combobox>
                                                <template if:true={isRegistrationJurisdictionOther}>
                                                    <div class="rfi-stack-gap">
                                                        <lightning-input label="Please specify the registration country"
                                                            value={formValues.Registration_Jurisdiction_Other__c} data-field="Registration_Jurisdiction_Other__c"
                                                            maxlength="255" onchange={handleFieldChange} required></lightning-input>
                                                    </div>
                                                </template>
                                            </div>
                                            <lightning-input type="date" label="Incorporation Date" value={formValues.Incorporation_Date__c}
                                                data-field="Incorporation_Date__c" min="1900-01-01" max={todayDateString}
                                                date-style="short" onchange={handleFieldChange} required></lightning-input>
                                        </div>

                                        <div class="rfi-richtext-wrapper rfi-section-gap">
                                            <label class="rfi-richtext-label">{descriptions.Q4GovLabel} <span class="required">*</span></label>
                                            <div class="subtext-muted rfi-richtext-helper">{descriptions.Q4GovHelper}</div>
                                            <div class="modern-toolbar">
                                                <button type="button" class="toolbar-min-btn" onmousedown={preventFocusLoss} onclick={handleBold}><b>B</b></button>
                                                <button type="button" class="toolbar-min-btn" onmousedown={preventFocusLoss} onclick={handleItalic}><i>I</i></button>
                                                <button type="button" class="toolbar-min-btn" onmousedown={preventFocusLoss} onclick={handleUnderline}><u>U</u></button>
                                            </div>
                                            <div class="modern-richtext-area" contenteditable="true" lwc:dom="manual"
                                                data-field="Legal_Structure__c" oninput={handleRichTextInput} onpaste={handlePaste}></div>
                                            <div class="rfi-richtext-footer">
    <button type="button" class="modern-ai-btn" data-id="Legal_Structure__c" onclick={handleAIClick}>✦ AI Feedback</button>
    <span class={wordCountClass.Legal_Structure__c}>{wordCountDisplay.Legal_Structure__c}</span>
</div>
                                        </div>
                                    </template>

                                    <!-- ═════════ Q5: Legal & tax compliance ═════════ -->
                                    <template if:true={q.isQ5}>
                                        <div class="rfi-grid-two">
                                            <lightning-combobox label="Do you have 501(c)(3) status or equivalent US tax-exempt determination?" value={formValues.Has_501c3_Status__c}
                                                options={yesNoOptions} data-field="Has_501c3_Status__c" onchange={handleFieldChange} required></lightning-combobox>
                                            <lightning-combobox label="Do you currently hold an active Equivalency Determination (ED) certificate?" value={formValues.Has_Equivalency_Determination__c}
                                                options={yesNoOptions} data-field="Has_Equivalency_Determination__c" onchange={handleFieldChange} required></lightning-combobox>
                                            <lightning-combobox label="Do you have a valid FCRA registration?" value={formValues.Is_FCRA_Registered__c}
                                                options={yesNoNotApplicableOptions} data-field="Is_FCRA_Registered__c" onchange={handleFieldChange} required></lightning-combobox>
                                            <lightning-combobox label="Are you willing to pursue an Equivalency Determination (ED) if selected?" value={formValues.Willing_to_Pursue_ED__c}
                                                options={yesNoOptions} data-field="Willing_to_Pursue_ED__c" onchange={handleFieldChange} required></lightning-combobox>
                                        </div>
                                    </template>

                                    <!-- ═════════ Q6: Fiscal year end ═════════ -->
                                    <template if:true={q.isQ6}>
                                        <p class="rfi-field-hint">{descriptions.Q6}</p>
                                        <div class="rfi-grid-two rfi-narrow">
                                            <lightning-combobox label="Fiscal Year End Month" value={formValues.Fiscal_Month__c}
                                                options={fiscalMonthOptions} data-field="Fiscal_Month__c" onchange={handleFiscalMonthChange} required></lightning-combobox>
                                            <lightning-combobox label="Fiscal Year End Day" value={formValues.Fiscal_Day__c}
                                                options={fiscalDayOptions} data-field="Fiscal_Day__c" onchange={handleFiscalDayChange} required></lightning-combobox>
                                        </div>
                                    </template>

                                    <!-- ═════════ Q7: Top funders (optional) ═════════ -->
                                    <template if:true={q.isQ7}>
                                        <p class="rfi-field-hint">{descriptions.Q7}</p>

                                        <div class="rfi-inner-card">
                                            <div class="rfi-inner-header"><span class="rfi-inner-label">FUNDER 1</span></div>
                                            <div class="rfi-grid-two">
                                                <lightning-input label="Funder Name" placeholder="e.g., Open Society Foundations" value={formValues.Funder_1_Name__c} data-field="Funder_1_Name__c" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input type="text" label="Approx Annual Amount (USD)" value={funderAmounts.f1} data-field="Funder_1_Amount__c" onchange={handleNumericChange}></lightning-input>
                                            </div>
                                            <div class="rfi-grid-three rfi-stack-gap">
                                                <lightning-input type="date" label="Funding Period Start" value={formValues.Funder_1_Period_Start__c} data-field="Funder_1_Period_Start__c" min="1990-01-01" max="2099-12-31" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input type="date" label="Funding Period End" value={formValues.Funder_1_Period_End__c} data-field="Funder_1_Period_End__c" min="1990-01-01" max="2099-12-31" onchange={handleFieldChange}></lightning-input>
                                                <lightning-combobox label="Funding Type" value={formValues.Funder_1_Type__c} options={funderTypeOptions} data-field="Funder_1_Type__c" onchange={handleFieldChange}></lightning-combobox>
                                            </div>
                                        </div>

                                        <div class="rfi-inner-card">
                                            <div class="rfi-inner-header"><span class="rfi-inner-label">FUNDER 2</span></div>
                                            <div class="rfi-grid-two">
                                                <lightning-input label="Funder Name" value={formValues.Funder_2_Name__c} data-field="Funder_2_Name__c" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input type="text" label="Approx Annual Amount (USD)" value={funderAmounts.f2} data-field="Funder_2_Amount__c" onchange={handleNumericChange}></lightning-input>
                                            </div>
                                            <div class="rfi-grid-three rfi-stack-gap">
                                                <lightning-input type="date" label="Funding Period Start" value={formValues.Funder_2_Period_Start__c} data-field="Funder_2_Period_Start__c" min="1990-01-01" max="2099-12-31" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input type="date" label="Funding Period End" value={formValues.Funder_2_Period_End__c} data-field="Funder_2_Period_End__c" min="1990-01-01" max="2099-12-31" onchange={handleFieldChange}></lightning-input>
                                                <lightning-combobox label="Funding Type" value={formValues.Funder_2_Type__c} options={funderTypeOptions} data-field="Funder_2_Type__c" onchange={handleFieldChange}></lightning-combobox>
                                            </div>
                                        </div>

                                        <div class="rfi-inner-card">
                                            <div class="rfi-inner-header"><span class="rfi-inner-label">FUNDER 3</span></div>
                                            <div class="rfi-grid-two">
                                                <lightning-input label="Funder Name" value={formValues.Funder_3_Name__c} data-field="Funder_3_Name__c" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input type="text" label="Approx Annual Amount (USD)" value={funderAmounts.f3} data-field="Funder_3_Amount__c" onchange={handleNumericChange}></lightning-input>
                                            </div>
                                            <div class="rfi-grid-three rfi-stack-gap">
                                                <lightning-input type="date" label="Funding Period Start" value={formValues.Funder_3_Period_Start__c} data-field="Funder_3_Period_Start__c" min="1990-01-01" max="2099-12-31" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input type="date" label="Funding Period End" value={formValues.Funder_3_Period_End__c} data-field="Funder_3_Period_End__c" min="1990-01-01" max="2099-12-31" onchange={handleFieldChange}></lightning-input>
                                                <lightning-combobox label="Funding Type" value={formValues.Funder_3_Type__c} options={funderTypeOptions} data-field="Funder_3_Type__c" onchange={handleFieldChange}></lightning-combobox>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- ═════════ Q8: References (optional) ═════════ -->
                                    <template if:true={q.isQ8}>
                                        <p class="rfi-field-hint">{descriptions.Q8}</p>
                                        <div class="rfi-consent-note">
                                            <strong>Consent:</strong> these contacts may be approached by Wadhwani Grants during evaluation.
                                        </div>
                                        <div class="rfi-inner-card">
                                            <div class="rfi-inner-header"><span class="rfi-inner-label">REFERENCE 1</span></div>
                                            <div class="rfi-grid-three">
                                                <lightning-input label="Name" value={formValues.Reference_1_Name__c} data-field="Reference_1_Name__c" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input label="Organization / Role" value={formValues.Reference_1_Role__c} data-field="Reference_1_Role__c" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input type="email" label="Email" value={formValues.Reference_1_Email__c} data-field="Reference_1_Email__c" onchange={handleFieldChange}></lightning-input>
                                            </div>
                                        </div>
                                        <div class="rfi-inner-card">
                                            <div class="rfi-inner-header"><span class="rfi-inner-label">REFERENCE 2</span></div>
                                            <div class="rfi-grid-three">
                                                <lightning-input label="Name" value={formValues.Reference_2_Name__c} data-field="Reference_2_Name__c" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input label="Organization / Role" value={formValues.Reference_2_Role__c} data-field="Reference_2_Role__c" onchange={handleFieldChange}></lightning-input>
                                                <lightning-input type="email" label="Email" value={formValues.Reference_2_Email__c} data-field="Reference_2_Email__c" onchange={handleFieldChange}></lightning-input>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- ═════════ Hints for numeric-table questions ═════════ -->
                                    <template if:true={q.isQ9}><p class="rfi-field-hint">{descriptions.Q9}</p></template>
                                    <template if:true={q.isQ10}><p class="rfi-field-hint">{descriptions.Q10}</p></template>
                                    <template if:true={q.isQ13}><p class="rfi-field-hint">{descriptions.Q13}</p></template>
                                    <template if:true={q.isQ14}><p class="rfi-field-hint">{descriptions.Q14}</p></template>
                                    <template if:true={q.isQ17}><p class="rfi-field-hint">{descriptions.Q17}</p></template>
                                    <template if:true={q.isQ18}><p class="rfi-field-hint">{descriptions.Q18}</p></template>
                                    <template if:true={q.isQ23}><p class="rfi-field-hint">{descriptions.Q23}</p></template>

                                    <!-- Q22: full outcome definition, same as the main form -->
                                    <template if:true={q.isQ22}>
                                        <div class="rfi-q22-desc">
                                            <p>A household counts as an outcome when both of these are true:</p>
                                            <ol>
                                                <li>Its yearly income is now Rs 1,00,000 or more.</li>
                                                <li>That income is at least 30% higher than when the household joined you.</li>
                                            </ol>
                                            <p>Both must be true of the same household. Growth is measured from when it joined, not from last year. Count each household once, in the first year both are true, and never again. A household counted in CFY-2 does not appear again in CFY-1.</p>
                                            <p class="rfi-q22-subhead">Examples (threshold: Rs 1,00,000)</p>
                                            <ul>
                                                <li>Rs 60,000 to Rs 84,000 (+40%): No. Grew enough, still under Rs 1,00,000.</li>
                                                <li>Rs 84,000 to Rs 1,20,000 (+43%): Yes. Both true.</li>
                                                <li>Rs 1,20,000 to Rs 1,44,000 (+20%): No. Above Rs 1,00,000, didn't grow enough.</li>
                                                <li>Rs 1,20,000 to Rs 1,80,000 (+50%): Yes. Both true.</li>
                                            </ul>
                                            <p>Income means take-home money the household keeps after business costs, not total sales. We compare the 6 months before you started with the most recent 6 months, and double each to get a yearly figure. Both readings need a bank or UPI statement covering that period, for the same named people. Where there is no household figure, use the person's own small business, judged the same way.</p>
                                            <p>Most households get there in about three years. That is a guide, not a cutoff. You tell us whether the household credits your work. We ask a sample of households the same question. This form asks only for the count. Household records come later, only if you receive a grant.</p>
                                        </div>
                                    </template>

                                    <!-- ═════════ Shared numeric table (Q9, Q10, Q13, Q14, Q17, Q18, Q22, Q23) ═════════ -->
                                    <template if:true={q.hasTable}>
                                        <div class="rfi-table-scroll">
                                            <table class="rfi-table">
                                                <thead>
                                                    <tr>
                                                        <th class="rfi-th-item">Item</th>
                                                        <template for:each={q.table.headers} for:item="h">
                                                            <th key={h.id}>{h.label}</th>
                                                        </template>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={q.table.rows} for:item="row">
                                                        <tr key={row.id} class={row.rowClass}>
                                                            <td class="rfi-td-label">
                                                                <template if:true={row.required}><span class="required rfi-row-required">*</span></template>
                                                                <strong>{row.label}</strong>
                                                                <template if:true={row.subtext}>
                                                                    <div class="subtext-muted">{row.subtext}</div>
                                                                </template>
                                                            </td>
                                                            <template for:each={row.cells} for:item="cell">
                                                                <td key={cell.id} class="rfi-td-value">
                                                                    <div class="rfi-currency-cell">
                                                                        <template if:true={cell.isCurrency}>
                                                                            <span class="rfi-currency-prefix">$</span>
                                                                        </template>
                                                                        <template if:true={cell.isComputed}>
                                                                            <div class="rfi-computed-cell"><strong>{cell.display}</strong></div>
                                                                        </template>
                                                                        <template if:true={cell.isInput}>
                                                                            <lightning-input
                                                                                class="rfi-cell-input"
                                                                                type="text"
                                                                                variant="label-hidden"
                                                                                label={cell.ariaLabel}
                                                                                value={cell.display}
                                                                                data-field={cell.key}
                                                                                onchange={handleNumericChange}>
                                                                            </lightning-input>
                                                                        </template>
                                                                    </div>
                                                                </td>
                                                            </template>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>

                                    <template if:true={q.isQ9}>
                                        <div class="subtext-muted rfi-table-footnote">You enter 7 numbers (1 start balance + 3 revenues + 3 expenses); the remaining cells fill automatically.</div>
                                    </template>

                                    <!-- Q10: deviation explanation (only when a deviation exists, same as main form) -->
                                    <template if:true={q.isQ10}>
                                        <template if:true={isDeviationExplanationRequired}>
                                            <div class="rfi-richtext-wrapper rfi-section-gap">
                                                <label class="rfi-richtext-label">{descriptions.Q10ExplLabel} <span class="required">*</span></label>
                                                <div class="subtext-muted rfi-richtext-helper">{descriptions.Q10ExplDesc}</div>
                                                <div class="modern-toolbar">
                                                    <button type="button" class="toolbar-min-btn" onmousedown={preventFocusLoss} onclick={handleBold}><b>B</b></button>
                                                    <button type="button" class="toolbar-min-btn" onmousedown={preventFocusLoss} onclick={handleItalic}><i>I</i></button>
                                                    <button type="button" class="toolbar-min-btn" onmousedown={preventFocusLoss} onclick={handleUnderline}><u>U</u></button>
                                                </div>
                                                <div class="modern-richtext-area" contenteditable="true" lwc:dom="manual"
                                                    data-field="Revenue_Explanation__c" oninput={handleRichTextInput} onpaste={handlePaste}></div>
                                                <div class="rfi-richtext-footer">
                                                    
                                                    <span class={wordCountClass.Revenue_Explanation__c}>{wordCountDisplay.Revenue_Explanation__c}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </template>

                                    <!-- ═════════ Q11: Skilling approach ═════════ -->
                                    <template if:true={q.isQ11}>
                                        <div class="rfi-richtext-wrapper">
                                            <label class="rfi-richtext-label">{q.title} <span class="required">*</span></label>
                                            <div class="subtext-muted rfi-richtext-helper">{descriptions.Q11}</div>
                                            <div class="modern-toolbar">
                                                <button type="button" class="toolbar-min-btn" onmousedown={preventFocusLoss} onclick={handleBold}><b>B</b></button>
                                                <button type="button" class="toolbar-min-btn" onmousedown={preventFocusLoss} onclick={handleItalic}><i>I</i></button>
                                                <button type="button" class="toolbar-min-btn" onmousedown={preventFocusLoss} onclick={handleUnderline}><u>U</u></button>
                                            </div>
                                            <div class="modern-richtext-area" contenteditable="true" lwc:dom="manual"
                                                data-field="Skilling_Approach__c" oninput={handleRichTextInput} onpaste={handlePaste}></div>
                                            <div class="rfi-richtext-footer">

                                <button type="button" class="btn-primary-red" onclick={closeAIModal}>Close</button>
