<template>
    <div class="slds-p-around_medium centered-form-container">

        <!-- ══ LOADING OVERLAY ══ -->
        <template if:true={isLoading}>
            <div class="wcf-submit-overlay" role="alert" aria-live="assertive">
                <div class="wcf-submit-modal">
                    <svg class="wcf-submit-spinner" viewBox="0 0 50 50">
                        <circle class="wcf-submit-spinner-track" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
                        <circle class="wcf-submit-spinner-arc" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
                    </svg>
                    <h2 class="wcf-submit-modal-title">Processing...</h2>
                    <p class="wcf-submit-modal-sub">Please wait while your application data is loaded or saved.</p>
                </div>
            </div>
        </template>

        <template if:false={isLoading}>

            <!-- ═════════════════════════════════════════════════════════════════════
                 SCREEN 1: TRACK SELECTION & FAQ (MATCHING MOCKUP)
            ══════════════════════════════════════════════════════════════════════ -->
            <template if:true={isScreen1}>
                <div class="screen-track-selection">

                    <!-- Header with WIN Logo & Title -->
                    <div class="rfi-branding-header">
                        <div class="wadhwani-logo-wrapper">
                            <img src={winLogoUrl} alt="WIN Logo" class="win-logo" />
                        </div>
                        <h1 class="rfi-page-title">Wadhwani Grants – Request for Information (RFI)</h1>
                    </div>

                    <!-- BLOCK 1: TRACK SELECTION, SECTION 1 -->
                    <div class="block-divider-label">BLOCK 1 · TRACK SELECTION, SECTION 1</div>

                    <div class="rfi-card-box">
                        <div class="modern-subsection-header">
                            <div class="modern-subsection-number">{qNum.Q1}</div>
                            <div>
                                <h2 class="q-title">Which of these does your work cover? <span class="required">*</span></h2>
                                <p class="q-subtitle">Select all that apply. Your answer sets which questions you get later in the form.</p>
                            </div>
                        </div>

                        <div class="track-options-list">
                            <template for:each={trackCards} for:item="trk">
                                <div key={trk.code} class={trk.cssClass} onclick={handleTrackSelect} data-code={trk.code}>
                                    <div class="custom-checkbox">
                                        <template if:true={trk.isSelected}>✓</template>
                                    </div>
                                    <span class="track-label-text">{trk.label}</span>
                                </div>
                            </template>
                        </div>

                        <!-- Blue Info Callout -->
                        <div class="blue-info-callout">
                            <span class="info-icon">ⓘ</span>
                            <span>Not sure which of these fit your work? <a href="javascript:void(0);" onclick={scrollToFaq} style="color: #003f73; font-weight: 600; text-decoration: underline; cursor: pointer;">Read what each track means.</a></span>
                        </div>

                        <div class="next-btn-row">
                            <button class="btn-primary-red" onclick={handleGoToForm} disabled={isNextDisabled}>Next</button>
                        </div>
                    </div>

                    <!-- BLOCK 2: SECTION 2 AND SECTION 3 INTRO TEXT -->
                    <div class="block-divider-label">BLOCK 2 · SECTION 2 AND SECTION 3 INTRO TEXT</div>

                    <div class="rfi-card-box">
                        <div class="intro-section-item">
                            <span class="section-tag">SECTION 2</span>
                            <h3 class="section-heading">What You Do</h3>
                            <p class="section-desc">Tell us about your work: your top programs, your approach, and what makes it different.</p>
                        </div>

                        <div class="intro-section-item" style="margin-top: 16px;">
                            <span class="section-tag">SECTION 3</span>
                            <h3 class="section-heading">What You've Delivered</h3>
                            <p class="section-desc">Tell us what you've achieved: your results for the last three years, plus your estimate for this year.</p>
                        </div>

                        <!-- Orange Callout Box -->
                        <div class="orange-callout-box">
                            <span class="orange-icon">⚠</span>
                            <span>Both lines are track-neutral on purpose. The questions underneath already change by track, so the intro no longer names one.</span>
                        </div>
                    </div>

                    <!-- BLOCK 3: FAQ, WHAT THE THREE TRACKS MEAN -->
                    <div data-id="faq-section" class="block-divider-label faq-section-target">BLOCK 3 · FAQ, WHAT THE THREE TRACKS MEAN</div>

                    <div class="rfi-card-box faq-card-box">
                        <!-- FAQ 1: Job Fulfillment -->
                        <div class="faq-item">
                            <div class="faq-header clickable" data-faq="jobFulfillment" onclick={toggleFaq}>
                                <span class="faq-symbol">{faqJobFulfillmentSymbol}</span>
                                <h3 class="faq-question-text">Job Fulfillment (Skilling and Placement)</h3>
                            </div>
                            <template if:true={isFaqJobFulfillmentOpen}>
                                <div class="faq-content-body">
                                    <p>Organizations in this track train youth in market-aligned vocational skills and place them into formal, wage-paying employment with verifiable employer records.</p>
                                    <div class="faq-example-box">
                                        <strong>Example.</strong> A vocational skilling institute offering 3-month certified technical courses, placing 85% of graduates into formal retail and logistics roles with offer letters.
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- FAQ 2: Job Creation -->
                        <div class="faq-item">
                            <div class="faq-header clickable" data-faq="jobCreation" onclick={toggleFaq}>
                                <span class="faq-symbol">{faqJobCreationSymbol}</span>
                                <h3 class="faq-question-text">Job Creation (SME / Enterprise Support)</h3>
                            </div>
                            <template if:true={isFaqJobCreationOpen}>
                                <div class="faq-content-body">
                                    <p>Organizations that accelerate early-stage micro and small enterprises, enabling them to expand operations and create net-new employment opportunities for others.</p>
                                    <div class="faq-example-box">
                                        <strong>Example.</strong> An enterprise accelerator providing capital access and mentorship to micro-manufacturers, directly resulting in each hiring 3–5 additional full-time staff.
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- FAQ 3: Livelihood -->
                        <div class="faq-item">
                            <div class="faq-header clickable" data-faq="livelihood" onclick={toggleFaq}>
                                <span class="faq-symbol">{faqLivelihoodSymbol}</span>
                                <h3 class="faq-question-text">Livelihood Upliftment</h3>
                            </div>
                            <template if:true={isFaqLivelihoodOpen}>
                                <div class="faq-content-body">
                                    <p>Interventions that systematically lift low-income household earnings to sustainable family-supporting thresholds (e.g., above ₹1,00,000/yr with 30%+ net uplift).</p>
                                    <div class="faq-example-box">
                                        <strong>Example.</strong> An agricultural producer company aggregating smallholder farmers, introducing high-value crop cultivation and direct market linkages to double net family incomes.
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                </div>
            </template>


            <!-- ═════════════════════════════════════════════════════════════════════
                 SCREEN 2: RFI QUESTIONNAIRE & DYNAMIC TABS
            ══════════════════════════════════════════════════════════════════════ -->
            <template if:false={isScreen1}>
                <div class="screen-questionnaire">

                    <!-- Header Branding -->
                    <div class="form-logo-title">
                        <img src={winLogoUrl} alt="WIN Logo" class="win-logo" />
                        <h1 class="rfi-page-title">Wadhwani Grants – Request for Information (RFI)</h1>
                    </div>

                    <!-- wcf-tracker Stepper (Matching wcfForm) -->
                    <div class="wcf-tracker">
                        <template for:each={dynamicTabs} for:item="tab">
                            <div key={tab.id} class="tracker-step" onclick={handleTabClick} data-tabid={tab.id}>
                                <div class={tab.bubbleClass}>
                                    <template if:true={tab.isCompleted}>✓</template>
                                    <template if:false={tab.isCompleted}>{tab.stepNum}</template>
                                </div>
                                <div class={tab.labelClass}>
                                    <div class="tracker-main-title">{tab.mainTitle}</div>
                                    <template if:true={tab.qRange}>
                                        <div class="tracker-qrange-subtitle">{tab.qRange}</div>
                                    </template>
                                </div>
                                <template if:true={tab.connectorClass}>
                                    <div class={tab.connectorClass}></div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- Action Bar -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <span class="section-step" style="font-weight: 700; color: #990000; letter-spacing: 0.05em; font-size: 0.85rem;">{currentTabSubTitle}</span>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn-secondary-outline" onclick={handleBackToTrackSelection}>Change Tracks</button>
                        </div>
                    </div>

                    <!-- Questionnaire Body -->
                    <div class="questionnaire-body">

                        <!-- ════════════════════════════════════════════════════════════
                             TAB 1: ABOUT YOUR ORGANIZATION (Q2 - Q10)
                        ═════════════════════════════════════════════════════════════ -->
                        <template if:true={isTabAboutOrg}>

                            <!-- Q2: Organizational Identifying Info -->
                            <div class="modern-subsection-card">
                                <div class="modern-subsection-header">
                                    <div class="modern-subsection-number">{qNum.Q2}</div>
                                    <div>
                                        <div class="modern-subsection-title">
                                            Organizational Identifying Information
                                            <span class="required">*</span>
                                        </div>
                                        <div class="modern-subsection-description">
                                            A few details so we know who we're talking to.
                                        </div>
                                    </div>
                                </div>

                                <div class="modern-form-grid">
                                    <!-- Organization Name -->
                                    <div class="modern-field">
                                        <lightning-input
                                            label="Organizational Name"
                                            value={formValues.Organization_Name__c}
                                            data-id="Organization_Name__c"
                                            data-key="Organization_Name__c"
                                            required
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </div>

                                    <!-- Headquarters City and Country Search -->
                                    <div class="modern-field">
                                        <div class="hq-city-search-wrapper">
                                            <lightning-input
                                                label="Headquarters City and Country"
                                                value={formValues.Headquarters_City_and_Country__c}
                                                data-id="Headquarters_City_and_Country__c"
                                                data-key="Headquarters_City_and_Country__c"
                                                onchange={handleHQChange}
                                                onfocus={handleHQFocus}
                                                onblur={handleHQBlur}
                                                autocomplete="off"
                                                required>
                                            </lightning-input>
                                            <p class="field-sub-instruction" style="font-size: 11px; color: #706e6b; margin-top: 2px;">
                                                e.g., "Chennai, India"
                                            </p>

                                            <template if:true={hqHasResults}>
                                                <div class="hq-dropdown">
                                                    <template for:each={hqResults} for:item="item">
                                                        <div key={item.value}
                                                             class="hq-dropdown-item"
                                                             data-value={item.value}
                                                             data-label={item.label}
                                                             data-country={item.country}
                                                             onmousedown={handleHQSelect}>
                                                            <span class="hq-city-name">{item.label}</span>
                                                            <span class="hq-city-detail">{item.subDisplay}</span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>

                                            <template if:true={hqIsLoading}>
                                                <div class="hq-loading-box">
                                                    <lightning-spinner alternative-text="Searching..." size="small"></lightning-spinner>
                                                </div>
                                            </template>

                                            <template if:true={hqNoResults}>
                                                <div class="hq-no-results">No cities found</div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Primary Service Regions -->
                                    <div class="modern-field full-width">
                                        <div class="field-helper" style="font-size: 0.75rem; font-weight: 600; color: #3e3e3c; margin-bottom: 2px;">
                                            Primary Service Regions <span class="required">*</span>
                                        </div>
                                        <lightning-input
                                            label="Where do you operate? List all states / provinces / regions."
                                            value={formValues.Primary_Service_Regions__c}
                                            data-id="Primary_Service_Regions__c"
                                            data-key="Primary_Service_Regions__c"
                                            required
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </div>

                                    <!-- Leader Name -->
                                    <div class="modern-field">
                                        <lightning-input
                                            label="Leader Name"
                                            value={formValues.Leader_Name__c}
                                            data-id="Leader_Name__c"
                                            data-key="Leader_Name__c"
                                            required
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </div>

                                    <!-- Leader Title -->
                                    <div class="modern-field">
                                        <lightning-input
                                            label="Leader Title"
                                            value={formValues.Leader_Title__c}
                                            data-id="Leader_Title__c"
                                            data-key="Leader_Title__c"
                                            required
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </div>

                                    <!-- Leader Tenure -->
                                    <div class="modern-field optional-field">
                                        <div class="subsection-title" style="font-size: 0.75rem; color: #706e6b; margin-bottom: 2px;">Leader Tenure (Optional)</div>
                                        <lightning-input
                                            type="number"
                                            label="Number of years your current named leader has held their role. Round to the nearest year."
                                            value={formValues.Leader_Tenure__c}
                                            data-id="Leader_Tenure__c"
                                            data-key="Leader_Tenure__c"
                                            min="0"
                                            max="99"
                                            step="1"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </div>

                                    <!-- Custom Questions for Section 2 (e.g. Q2_VOLUNTEER_COUNT) -->
                                    <template if:true={hasCustomQuestionsQ2}>
                                        <template for:each={customQuestionsQ2} for:item="cq">
                                            <div key={cq.key} class={cq.wrapperClass}>
                                                <div class="field-helper" style="font-size: 0.75rem; font-weight: 600; color: #3e3e3c; margin-bottom: 2px;">
                                                    {cq.label} <template if:true={cq.isRequired}><span class="required">*</span></template>
                                                </div>
                                                <template if:true={cq.helpText}>
                                                    <div style="font-size: 0.75rem; color: #706e6b; margin-bottom: 4px;">{cq.helpText}</div>
                                                </template>
                                                <template if:true={cq.isText}>
                                                    <lightning-input label={cq.label} value={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder={cq.placeholder} variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={cq.isTextArea}>
                                                    <lightning-textarea label={cq.label} value={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder={cq.placeholder} variant="label-hidden"></lightning-textarea>
                                                </template>
                                                <template if:true={cq.isNumber}>
                                                    <lightning-input type="number" label={cq.label} value={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder={cq.placeholder} variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={cq.isDate}>
                                                    <lightning-input type="date" label={cq.label} value={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={cq.isPicklist}>
                                                    <lightning-combobox label={cq.label} value={cq.value} options={cq.options} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder="— Select —" variant="label-hidden"></lightning-combobox>
                                                </template>
                                                <template if:true={cq.isCheckbox}>
                                                    <lightning-input type="checkbox" label={cq.label} checked={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange}></lightning-input>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>

                            <!-- Q3: Submitter Contact Information -->
                            <div class="modern-subsection-card">
                                <div class="modern-subsection-header">
                                    <div class="modern-subsection-number">{qNum.Q3}</div>
                                    <div>
                                        <div class="modern-subsection-title">
                                            Submitter Contact Information
                                            <span class="required">*</span>
                                        </div>
                                        <div class="modern-subsection-description">
                                            Who is filling out this form? You'll be the initial point of contact for your organisation.
                                        </div>
                                    </div>
                                </div>

                                <div class="modern-form-grid">
                                    <!-- Submitter Name -->
                                    <div class="modern-field">
                                        <lightning-input
                                            label="Name"
                                            value={formValues.Submitter_Name__c}
                                            data-id="Submitter_Name__c"
                                            data-key="Submitter_Name__c"
                                            required
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </div>

                                    <!-- Submitter Job Title -->
                                    <div class="modern-field">
                                        <lightning-input
                                            label="Title"
                                            value={formValues.Job_Title__c}
                                            data-id="Job_Title__c"
                                            data-key="Job_Title__c"
                                            required
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </div>

                                    <!-- Phone Number -->
                                    <div class="modern-field">
                                        <div class="slds-form-element">
                                            <label class="slds-form-element__label" for="phoneNumberInput">
                                                <abbr class="slds-required" title="required">*</abbr>
                                                Phone number
                                            </label>
                                            <div class="slds-form-element__control">
                                                <div class={phoneFieldWrapperClass}>
                                                    <input
                                                        id="phoneNumberInput"
                                                        data-id="phone"
                                                        type="tel"
                                                        inputmode="numeric"
                                                        autocomplete="off"
                                                        class="phone-number-native-input phone-iti-input"
                                                        placeholder="e.g. 9876543210"
                                                        value={formValues.Phone__c}
                                                        oninput={handlePhoneNumberInput}
                                                        required />
                                                </div>
                                            </div>
                                        </div>

                                        <template if:true={phoneNumberError}>
                                            <p class="phone-error-msg">{phoneNumberError}</p>
                                        </template>
                                    </div>

                                    <!-- Work Email Address -->
                                    <div class="modern-field">
                                        <lightning-input
                                            type="email"
                                            label="Email Address"
                                            value={formValues.Work_Email_ID__c}
                                            data-id="Work_Email_ID__c"
                                            data-key="Work_Email_ID__c"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-input>
                                    </div>

                                    <!-- Custom Questions for Section 3 -->
                                    <template if:true={hasCustomQuestionsQ3}>
                                        <template for:each={customQuestionsQ3} for:item="cq">
                                            <div key={cq.key} class={cq.wrapperClass}>
                                                <div class="field-helper" style="font-size: 0.75rem; font-weight: 600; color: #3e3e3c; margin-bottom: 2px;">
                                                    {cq.label} <template if:true={cq.isRequired}><span class="required">*</span></template>
                                                </div>
                                                <template if:true={cq.helpText}>
                                                    <div style="font-size: 0.75rem; color: #706e6b; margin-bottom: 4px;">{cq.helpText}</div>
                                                </template>
                                                <template if:true={cq.isText}>
                                                    <lightning-input label={cq.label} value={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder={cq.placeholder} variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={cq.isTextArea}>
                                                    <lightning-textarea label={cq.label} value={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder={cq.placeholder} variant="label-hidden"></lightning-textarea>
                                                </template>
                                                <template if:true={cq.isNumber}>
                                                    <lightning-input type="number" label={cq.label} value={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder={cq.placeholder} variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={cq.isDate}>
                                                    <lightning-input type="date" label={cq.label} value={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={cq.isPicklist}>
                                                    <lightning-combobox label={cq.label} value={cq.value} options={cq.options} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder="— Select —" variant="label-hidden"></lightning-combobox>
                                                </template>
                                                <template if:true={cq.isCheckbox}>
                                                    <lightning-input type="checkbox" label={cq.label} checked={cq.value} data-field={cq.targetField} data-id={cq.targetField} data-key={cq.targetField} onchange={handleInputChange}></lightning-input>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>

                            <!-- Q4: Legal Structure -->
                            <div class="modern-subsection-card">
                                <div class="modern-subsection-header">
                                    <div class="modern-subsection-number">{qNum.Q4}</div>
                                    <div>
                                        <div class="modern-subsection-title">
                                            Legal Structure
                                            <span class="required">*</span>
                                        </div>
                                        <div class="modern-subsection-description">
                                            Tell us how your organisation is legally constituted and where it's registered.
                                        </div>
                                    </div>
                                </div>

                                <div class="modern-form-grid legal-grid">
                                    <!-- Legal Type -->
                                    <div class="modern-field">
                                        <lightning-combobox
                                            label="Type"
                                            value={formValues.Legal_Type__c}
                                            options={legalTypeOptions}
                                            data-id="Legal_Type__c"
                                            data-key="Legal_Type__c"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>

                                        <template if:true={showLegalTypeOther}>
                                            <div style="margin-top: 10px;">
                                                <lightning-input
                                                    type="text"
                                                    label="Please specify your legal structure type"
                                                    value={formValues.Legal_Type_Other__c}
                                                    data-id="Legal_Type_Other__c"
                                                    data-key="Legal_Type_Other__c"
                                                    maxlength="255"
                                                    onchange={handleInputChange}
                                                    required>
                                                </lightning-input>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Registration Jurisdiction -->
                                    <div class="modern-field">
                                        <lightning-combobox
                                            label="Registration Jurisdiction"
                                            value={formValues.Registration_Jurisdiction__c}
                                            options={countryOptions}
                                            data-id="Registration_Jurisdiction__c"
                                            data-key="Registration_Jurisdiction__c"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>

                                        <template if:true={showRegistrationJurisdictionOther}>
                                            <div style="margin-top: 10px;">
                                                <lightning-input
                                                    type="text"
                                                    label="Please specify the registration country"
                                                    value={formValues.Registration_Jurisdiction_Other__c}
                                                    data-id="Registration_Jurisdiction_Other__c"
                                                    data-key="Registration_Jurisdiction_Other__c"
                                                    maxlength="255"
                                                    onchange={handleInputChange}
                                                    required>
                                                </lightning-input>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Incorporation Date -->
                                    <div class="modern-field">
                                        <label class="modern-field-label">
                                            Incorporation Date <span class="required">*</span>
                                        </label>
                                        <div class="date-field-wrapper">
                                            <input type="date"
                                                   class="date-native-input"
                                                   value={formValues.Incorporation_Date__c}
                                                   data-id="Incorporation_Date__c"
                                                   data-key="Incorporation_Date__c"
                                                   min="1800-01-01"
                                                   max={todayDateString}

                                    <div class="mockup-optional-number">{qNum.Q8}</div>

                                </div>

                                            value={formValues.Reference_1_Name__c}
                                            data-id="Reference_1_Name__c"
                                            data-key="Reference_1_Name__c"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                        <lightning-input
                                            label="Organization / Role"
                                            value={formValues.Reference_1_Role__c}
                                            data-id="Reference_1_Role__c"
                                            data-key="Reference_1_Role__c"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                        <lightning-input
                                            type="email"
                                            label="Email"
                                            value={formValues.Reference_1_Email__c}
                                            data-id="Reference_1_Email__c"
                                            data-key="Reference_1_Email__c"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </div>
                                </div>

                                <!-- REFERENCE 2 -->
                                <template if:true={showReference2}>

                                        <div class="mockup-inner-top">
                                            <div class="mockup-inner-label">REFERENCE 2</div>
                                            <div class="mockup-remove" style="color: #c23934; cursor: pointer; font-weight: 600;" onclick={handleRemoveReference2}>✕ Remove</div>
                                        </div>
                                        <div class="mockup-grid-three">
                                            <lightning-input
                                                label="Name"
                                                value={formValues.Reference_2_Name__c}
                                                data-id="Reference_2_Name__c"
                                                data-key="Reference_2_Name__c"
                                                onchange={handleInputChange}>
                                            </lightning-input>
                                            <lightning-input
                                                label="Organization / Role"
                                                value={formValues.Reference_2_Role__c}
                                                data-id="Reference_2_Role__c"
                                                data-key="Reference_2_Role__c"
                                                onchange={handleInputChange}>
                                            </lightning-input>
                                            <lightning-input
                                                type="email"
                                                label="Email"
                                                value={formValues.Reference_2_Email__c}
                                                data-id="Reference_2_Email__c"
                                                data-key="Reference_2_Email__c"
                                                onchange={handleInputChange}>
                                            </lightning-input>
                                        </div>
                                    </div>
                                </template>

                                <!-- ADD REFERENCE BUTTON -->
                                <div class="mockup-add-row" style="margin-top: 16px; display: flex; align-items: center; gap: 12px;">
                                    <button

                                        onclick={handleAddReference}
                                        disabled={isReferenceLimitReached}>
                                        + Add reference
                                    </button>
                                    <span style="font-size: 0.82rem; color: #666;">You may add up to 2 references.</span>
                                </div>
                            </div>

                            <!-- Q9: Historical Financial Data -->
                            <div class="modern-subsection-card">
                                <div class="modern-subsection-header">
                                    <div class="modern-subsection-number">{qNum.Q9}</div>
                                    <div>
                                        <div class="modern-subsection-title">Historical Financial Data</div>
                                        <div class="modern-subsection-description">
                                            Enter your historical figures across the three prior fiscal years. Starting balance for the earliest year and revenue/expense are inputs; year-end balances are computed automatically.
                                        </div>
                                    </div>
                                </div>

                                <div class="table-container">
                                    <table class="rfi-data-table">
                                        <thead>
                                            <tr>
                                                <th>Item</th>
                                                <th>{fiscalYears.fy3Label}</th>
                                                <th>{fiscalYears.fy2Label}</th>
                                                <th>{fiscalYears.fy1Label}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td>
                                                    <span class="required">*</span> <strong>Balance at Start of Year</strong>
                                                    <div class="subtext-muted">Earliest year only — chains forward automatically..</div>
                                                </td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.START_FY3} onchange={handleInputChange} data-key="START_FY3" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell">{computedStartFY2}</div></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell">{computedStartFY1}</div></div></td>
                                            </tr>
                                            <tr>
                                                <td><span class="required">*</span> <strong>Revenue</strong></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.REV_FY3} onchange={handleInputChange} data-key="REV_FY3" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.REV_FY2} onchange={handleInputChange} data-key="REV_FY2" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.REV_FY1} onchange={handleInputChange} data-key="REV_FY1" min="0"></lightning-input></div></td>
                                            </tr>
                                            <tr>
                                                <td>
                                                    <span class="required">*</span> <strong>Capital expenditure</strong>
                                                    <div class="subtext-muted">Capital expenditure: money spent on lasting assets, such as equipment, vehicles, or premises.</div>
                                                </td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.CAP_FY3} onchange={handleInputChange} data-key="CAP_FY3" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.CAP_FY2} onchange={handleInputChange} data-key="CAP_FY2" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.CAP_FY1} onchange={handleInputChange} data-key="CAP_FY1" min="0"></lightning-input></div></td>
                                            </tr>
                                            <tr>
                                                <td>
                                                    <span class="required">*</span> <strong>Operating expenditure</strong>
                                                    <div class="subtext-muted">Operating expenditure: day-to-day running costs, such as salaries, rent, and program delivery.</div>
                                                </td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.OP_FY3} onchange={handleInputChange} data-key="OP_FY3" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.OP_FY2} onchange={handleInputChange} data-key="OP_FY2" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.OP_FY1} onchange={handleInputChange} data-key="OP_FY1" min="0"></lightning-input></div></td>
                                            </tr>
                                            <tr class="end-balance-row">
                                                <td>
                                                    <strong>Balance at End of Year</strong>
                                                    <div class="subtext-muted">Auto-computed = Start + Revenue - Expense</div>
                                                </td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell"><strong>{computedEndFY3}</strong></div></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell"><strong>{computedEndFY2}</strong></div></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell"><strong>{computedEndFY1}</strong></div></div></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <div class="subtext-muted" style="margin-top: 8px; font-style: italic;">You enter 7 numbers (1 start balance + 3 revenues + 3 expenses); the remaining cells fill automatically.</div>
                                </div>
                            </div>

                            <!-- Q10: Current Fiscal Year Data -->
                            <div class="modern-subsection-card">
                                <div class="modern-subsection-header">
                                    <div class="modern-subsection-number">{qNum.Q10}</div>
                                    <div>
                                        <div class="modern-subsection-title">Current Fiscal Year Data</div>
                                        <div class="modern-subsection-description">
                                            Your current fiscal year budget, latest projection, and explanation of any deviation.
                                        </div>
                                    </div>
                                </div>

                                <div class="table-container">
                                    <table class="rfi-data-table">
                                        <thead>
                                            <tr>
                                                <th>Item</th>
                                                <th>Budget</th>
                                                <th>Projection</th>
                                                <th>Deviation (auto-computed: Projection – Budget)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td><span class="required">*</span> <strong>Revenue</strong></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.CFY_REV_BUDGET} onchange={handleInputChange} data-key="CFY_REV_BUDGET" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.CFY_REV_PROJ} onchange={handleInputChange} data-key="CFY_REV_PROJ" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell"><strong>{computedRevDeviation}</strong></div></div></td>
                                            </tr>
                                            <tr>
                                                <td>
                                                    <span class="required">*</span> <strong>Capital expenditure</strong>
                                                    <div class="subtext-muted">Capital expenditure: money spent on lasting assets, such as equipment, vehicles, or premises.</div>
                                                </td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.CFY_CAP_BUDGET} onchange={handleInputChange} data-key="CFY_CAP_BUDGET" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.CFY_CAP_PROJ} onchange={handleInputChange} data-key="CFY_CAP_PROJ" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell"><strong>{computedCapDeviation}</strong></div></div></td>
                                            </tr>
                                            <tr>
                                                <td>
                                                    <span class="required">*</span> <strong>Operating expenditure</strong>
                                                    <div class="subtext-muted">Operating expenditure: day-to-day running costs, such as salaries, rent, and program delivery.</div>
                                                </td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.CFY_OP_BUDGET} onchange={handleInputChange} data-key="CFY_OP_BUDGET" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><lightning-input type="number" value={formValues.CFY_OP_PROJ} onchange={handleInputChange} data-key="CFY_OP_PROJ" min="0"></lightning-input></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell"><strong>{computedOpDeviation}</strong></div></div></td>
                                            </tr>
                                            <tr class="end-balance-row">
                                                <td>
                                                    <strong>Revenue - Expense</strong>
                                                    <div class="subtext-muted">Auto-computed</div>
                                                </td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell"><strong>{computedNetBudget}</strong></div></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell"><strong>{computedNetProjection}</strong></div></div></td>
                                                <td><div class="currency-input-cell"><span class="currency-prefix">$</span><div class="computed-cell"><strong>{computedNetDeviation}</strong></div></div></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <!-- Explanation of Deviation Rich Text Box (ONLY OPENS WHEN DEVIATION OCCURS) -->
                                <template if:true={isDeviationExplanationRequired}>
                                    <div class="modern-richtext-wrapper" style="margin-top: 24px;">
                                        <div class="modern-richtext-label">
                                            Explanation of deviation
                                            <span class="required">*</span>
                                        </div>
                                        <div class="modern-richtext-helper">
                                            Required if total deviation is non-zero (combined revenue + expense; &lt;200 words).
                                        </div>

                                        <!-- Toolbar -->
                                        <div class="modern-toolbar">
                                            <button class="toolbar-min-btn" type="button" onclick={boldText}>B</button>
                                            <button class="toolbar-min-btn" type="button" onclick={italicText}>I</button>
                                            <button class="toolbar-min-btn" type="button" onclick={underlineText}>U</button>
                                            <button class="toolbar-min-btn" type="button" onclick={insertBulletPoints}>•</button>
                                        </div>

                                        <!-- Editable Rich Text Box -->
                                        <div
                                            class="modern-richtext-area"
                                            contenteditable="true"
                                            data-field="Revenue_Explanation__c"
                                            onclick={setActiveField}
                                            oninput={handleInputChange}
                                            onpaste={handlePaste}
                                            onkeydown={handleKeyDown}>
                                        </div>
                                        <p class="error-msg" data-error="Revenue_Explanation__c" style="display: none; color: #c23934; font-size: 12px; margin-top: 4px;"></p>

                                        <!-- Footer with AI Feedback button & Word Counter -->
                                        <template if:true={isDeviationExplanationOverLimit}>
                                            <div class="field-error-message" style="color: #c23934; font-size: 0.8125rem; font-weight: 600; margin-top: 6px;">
                                                ⚠️ {deviationExplanationError}
                                            </div>
                                        </template>
                                        <div class="modern-richtext-footer" style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                                            <button
                                                type="button"
                                                class="modern-ai-btn"
                                                onclick={handleAIClick}
                                                data-id="Revenue_Explanation__c">
                                                ✦ AI Feedback
                                            </button>
                                            <div class={deviationExplanationCounterClass}>
                                                {deviationExplanationWordCount} / 200 words
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Dynamic Custom Questions for About Org -->
                            <template if:true={hasCustomQuestionsAboutOrg}>
                                <template for:each={customQuestionsAboutOrg} for:item="cq">
                                    <div key={cq.key} class="modern-subsection-card">
                                        <div class="modern-subsection-header">
                                            <div class="modern-subsection-number">{cq.displayNumber}</div>
                                            <div>
                                                <div class="modern-subsection-title">{cq.label} <template if:true={cq.isRequired}><span class="required">*</span></template></div>
                                                <template if:true={cq.helpText}><div class="modern-subsection-description">{cq.helpText}</div></template>
                                            </div>
                                        </div>
                                        <div class="modern-form-grid">
                                            <div class="modern-field full-width">
                                                <template if:true={cq.isText}>
                                                    <lightning-input label={cq.label} value={cq.value} data-field={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder={cq.placeholder} variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={cq.isTextArea}>
                                                    <lightning-textarea label={cq.label} value={cq.value} data-field={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder={cq.placeholder} variant="label-hidden"></lightning-textarea>
                                                </template>
                                                <template if:true={cq.isNumber}>
                                                    <lightning-input type="number" label={cq.label} value={cq.value} data-field={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder={cq.placeholder} variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={cq.isDate}>
                                                    <lightning-input type="date" label={cq.label} value={cq.value} data-field={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} variant="label-hidden"></lightning-input>
                                                </template>
                                                <template if:true={cq.isPicklist}>
                                                    <lightning-combobox label={cq.label} value={cq.value} options={cq.options} data-field={cq.targetField} data-key={cq.targetField} onchange={handleInputChange} required={cq.isRequired} placeholder="— Select —" variant="label-hidden"></lightning-combobox>
                                                </template>
                                                <template if:true={cq.isCheckbox}>
                                                    <lightning-input type="checkbox" label={cq.label} checked={cq.value} data-field={cq.targetField} data-key={cq.targetField} onchange={handleInputChange}></lightning-input>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </template>

                        </template>


                        <!-- ════════════════════════════════════════════════════════════
                             TAB 2: JOB FULFILLMENT (Q11 - Q14)
                        ═════════════════════════════════════════════════════════════ -->
                        <template if:true={isTabJobFulfillment}>

                            <!-- Q11: Your Skilling Approach -->
                            <div class="modern-subsection-card">
                                <div class="modern-subsection-header">
                                    <div class="modern-subsection-number">{qNum.Q11}</div>
                                    <div>
                                        <div class="modern-subsection-title">Your Skilling Approach <span class="required">*</span></div>
                                        <div class="modern-subsection-description">Tell us about your skilling work in roughly 500 words. If you run named programs, walk us through your top three (names, what they teach, who they serve). Cover your theory of change, the journey from learner enrollment to placement, and what makes your approach different from others.</div>
                                    </div>
                                </div>
                                <div class="modern-richtext-wrapper">
                                    <!-- Toolbar -->
                                    <div class="modern-toolbar">
                                        <button class="toolbar-min-btn" type="button" onclick={boldText}>B</button>
                                        <button class="toolbar-min-btn" type="button" onclick={italicText}>I</button>
                                        <button class="toolbar-min-btn" type="button" onclick={underlineText}>U</button>
                                        <button class="toolbar-min-btn" type="button" onclick={insertBulletPoints}>•</button>
                                    </div>

                                    <!-- Editable Rich Text Box -->
                                    <div
                                        class="modern-richtext-area"
                                        contenteditable="true"
                                        data-field="Skilling_Approach__c"
                                        data-id="Skilling_Approach__c"
                                        onclick={setActiveField}
                                        oninput={handleInputChange}
                                        onpaste={handlePaste}
                                        onkeydown={handleKeyDown}>
                                    </div>
                                    <p class="error-msg" data-error="Skilling_Approach__c" style="display: none; color: #c23934; font-size: 12px; margin-top: 4px;"></p>

                                    <!-- Footer with AI Feedback button & Word Counter -->
                                    <template if:true={isSkillingApproachOverLimit}>
                                        <div class="field-error-message" style="color: #c23934; font-size: 0.8125rem; font-weight: 600; margin-top: 6px;">
                                            ⚠️ {skillingApproachError}
                                        </div>
                                    </template>
                                    <div class="modern-richtext-footer" style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                                        <button
                                            type="button"
                                            class="modern-ai-btn"
                                            onclick={handleAIClick}
                                            data-id="Skilling_Approach__c">
                                            ✦ AI Feedback
                                        </button>
                                        <div class={skillingApproachCounterClass}>
                                            {skillingApproachWordCount} / 500 words
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Q12: Skilling Domains Offered -->
                            <div class="modern-subsection-card">
                                <div class="modern-subsection-header">
                                    <div class="modern-subsection-number">{qNum.Q12}</div>
                                    <div>
                                        <div class="modern-subsection-title">Skilling Domains Offered</div>
                                        <div class="modern-subsection-description">List the skilling domains your organization offers (one row each, minimum 1). For each: typical training hours, duration in months, when you started running it, and your annual enrollment.</div>
                                    </div>
                                </div>

                                <div class="table-container">
                                    <table class="rfi-data-table">
                                        <thead>
                                            <tr>
                                                <th>Domain / Program Name</th>
                                                <th>Hours of Training</th>
                                                <th>Duration (Months)</th>
                                                <th>When Started (DD/MM/YYYY)</th>
                                                <th>Annual Enrollment</th>
                                                <th style="width: 45px; text-align: center;"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={skillingDomainRows} for:item="row">
                                                <tr key={row.id}>
                                                    <td><lightning-input type="text" value={row.name} onchange={handleSkillingDomainChange} data-id={row.id} data-field="name"></lightning-input></td>
                                                    <td>
                                                        <input type="number"
                                                               class="wcf-number-input"
                                                               value={row.hours}
                                                               data-id={row.id}
                                                               data-field="hours"
                                                               min="0"
                                                               onchange={handleSkillingDomainChange} />
                                                    </td>
                                                    <td>
                                                        <input type="number"
                                                               class="wcf-number-input"
                                                               value={row.duration}
                                                               data-id={row.id}
                                                               data-field="duration"
                                                               min="0"
                                                               onchange={handleSkillingDomainChange} />
                                                    </td>
                                                    <td>
                                                        <div class="date-field-wrapper">
                                                            <input type="date"
                                                                   class="date-native-input"
                                                                   value={row.whenStarted}
                                                                   data-id={row.id}
                                                                   data-field="whenStarted"
                                                                   min="1900-01-01"
                                                                   max={todayDateString}
                                                                   onkeydown={handleDateKeyDown}
                                                                   onclick={handleDateClick}
                                                                   onchange={handleSkillingDomainChange} />
                                                            <span class="date-overlay-text">{row.displayWhenStarted}</span>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <input type="number"
                                                               class="wcf-number-input"
                                                               value={row.enrollment}
                                                               data-id={row.id}
                                                               data-field="enrollment"
                                                               min="0"
                                                               onchange={handleSkillingDomainChange} />
                                                    </td>
                                                    <td style="text-align: center; vertical-align: middle;">
                                                        <template if:true={canRemoveSkillingDomainRow}>
                                                            <button type="button" class="btn-remove-row" data-id={row.id} onclick={handleRemoveSkillingDomainRow} title="Remove Row">✕</button>
                                                        </template>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                                <div style="margin-top: 12px;">
                                    <button class="btn-secondary-outline" onclick={addSkillingDomainRow}>+ Add Domain Row</button>
                                </div>
                            </div>

                            <!-- Q13: Job Fulfillment Outcomes (Actuals) -->
                            <div class="modern-subsection-card">
                                <div class="modern-subsection-header">
                                    <div class="modern-subsection-number">{qNum.Q13}</div>

                                            <p style="margin-bottom: 8px;">A household counts as an outcome when both of these are true:</p>

                                            </ol>
                                            <p style="margin-bottom: 8px;">Both must be true of the same household. Growth is measured from when it joined, not from last year. Count each household once, in the first year both are true, and never again. A household counted in CFY-2 does not appear again in CFY-1.</p>
                                            
                                            <p style="margin-bottom: 4px; font-weight: 600;">Examples (threshold: Rs 1,00,000)</p>
                                            <ul style="margin-left: 20px; margin-bottom: 8px; list-style-type: disc;">

                                                <li>Rs 1,20,000 to Rs 1,44,000 (+20%): No. Above Rs 1,00,000, didn't grow enough.</li>
                                                <li>Rs 1,20,000 to Rs 1,80,000 (+50%): Yes. Both true.</li>
                                            </ul>

                                            <p style="margin-bottom: 8px;">Income means take-home money the household keeps after business costs, not total sales. We compare the 6 months before you started with the most recent 6 months, and double each to get a yearly figure. Both readings need a bank or UPI statement covering that period, for the same named people. Where there is no household figure, use the person's own small business, judged the same way.</p>

                                            <p style="margin-bottom: 0;">Most households get there in about three years. That is a guide, not a cutoff. You tell us whether the household credits your work. We ask a sample of households the same question. This form asks only for the count. Household records come later, only if you receive a grant.</p>

                                            <div class="ai-section-title" style="font-weight: 700; font-size: 0.85rem; color: #706e6b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;">
                                                {section.title}
                                            </div>
                                            <ul class="ai-points" style="margin: 0; padding-left: 18px; color: #2d3748; font-size: 0.9rem; line-height: 1.5;">
                                                <template for:each={section.points} for:item="point">
                                                    <li key={point} style="margin-bottom: 4px;">
                                                        <lightning-formatted-rich-text value={point}></lightning-formatted-rich-text>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
                        <button type="button" class="btn-primary-red" onclick={closeAIModal}>Close</button>
                    </div>
                </div>
            </section>
        </template>

    </template>
    </div>
</template>
